<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>猪八吉爱媳妇 | ADHD深度测评</title>
    <!-- 性能优化：延迟加载图表库 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js" defer></script>
    <style>
        :root {
            --bg-linen: #FAF7F2;      
            --card-white: #FFFFFF;
            --watermelon-red: #FF5B67; 
            --text-walnut: #5D524A;   
            --text-sand: #9E8E85;     
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, "PingFang SC", sans-serif;
            background-color: var(--bg-linen); color: var(--text-walnut);
            margin: 0; padding: 0; line-height: 1.4; -webkit-font-smoothing: antialiased;
        }

        /* 顶部极致压缩 */
        .brand-header { padding: 12px 20px 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .baji-logo { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; border: 1px solid #EEE; }
        .baji-logo img { width: 100%; height: 100%; object-fit: cover; }
        .brand-info h1 { font-size: 1rem; margin: 0; font-weight: 600; }
        .brand-info p { font-size: 0.85rem; margin: 0; color: var(--watermelon-red); font-weight: bold; }

        .container { width: 100%; max-width: 500px; margin: 0 auto; padding: 0 12px 15px; }

        /* 卡片内边距压缩，确保一屏 */
        .card {
            background: var(--card-white); padding: 18px 18px; border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.03); display: none;
        }
        .fade-in { display: block; animation: smoothSlide 0.4s ease-out; }
        @keyframes smoothSlide { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* 答题区：第x题 */
        .q-header { margin-bottom: 15px; }
        .q-label-row { font-size: 0.8rem; color: var(--watermelon-red); margin-bottom: 6px; font-weight: bold; display: flex; justify-content: space-between; }
        .bar-bg { width: 100%; height: 3px; background: #F0EEEA; border-radius: 2px; }
        #bar-fill { height: 100%; background: var(--watermelon-red); width: 0%; transition: width 0.3s; }
        
        /* 题目字号适中 */
        .q-text { font-size: 1.05rem; font-weight: 600; margin-bottom: 15px; min-height: 45px; line-height: 1.4; color: var(--text-walnut); }

        /* 选项设计 */
        .options-group { display: flex; flex-direction: column; gap: 8px; }
        .option-card {
            width: 100%; padding: 12px 18px; border: 1px solid #F0EEEA;
            border-radius: 14px; background: #FCFAF8; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.2s; font-size: 0.95rem; color: var(--text-walnut);
        }
        /* 点击选中的西瓜红反馈 */
        .option-card.active { background: var(--watermelon-red) !important; color: #FFF !important; border-color: var(--watermelon-red); transform: scale(0.98); }
        .score-hint { font-size: 0.6rem; opacity: 0.4; }

        /* 结果页可视化 */
        .result-header { text-align: center; margin-bottom: 15px; }
        .score-num { font-size: 3.2rem; font-weight: bold; color: var(--watermelon-red); line-height: 1; margin-bottom: 5px; }
        .tag-pill { display: inline-block; padding: 4px 12px; background: #FFF5F6; color: var(--watermelon-red); border-radius: 50px; font-size: 0.75rem; font-weight: 600; }
        .advice-card { background: #FCFAF8; padding: 15px; border-radius: 16px; margin: 15px 0; line-height: 1.5; font-size: 0.85rem; border: 1px solid #EEE; }

        .btn-red { background: var(--watermelon-red); color: #FFF; border: none; padding: 14px; border-radius: 50px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        
        /* 隐藏 Chart 容器直到需要 */
        #chart-container { max-width: 240px; margin: 0 auto 15px; display: none; }
    </style>
</head>
<body>

    <header class="brand-header">
        <div class="baji-logo"><img src="https://jasmine2025888.github.io/love-language-translator/assets/logo.png" alt="logo"></div>
        <div class="brand-info"><h1>猪八吉爱媳妇</h1><p>中国式亲密关系研究所</p></div>
    </header>

    <div class="container">
        <!-- 开始页 -->
        <div class="card fade-in" id="start-page" style="text-align: center;">
            <h2 style="font-size: 1.2rem; margin: 0 0 10px;">ADHD多维度深度筛查量表</h2>
            <p style="font-size: 0.8rem; color: var(--text-sand); margin-bottom: 20px;">共40题 | 预计8分钟 | 深度识别思维偏好</p>
            <div style="text-align: left; background: #FAF9F8; padding: 15px; border-radius: 15px; font-size: 0.8rem; border-left: 3px solid var(--watermelon-red); margin-bottom: 20px;">
                <strong>测评须知：</strong>回顾过去六个月的真实表现。识别特质是开启接纳的第一步。
            </div>
            <button class="btn-red" onclick="startQuiz()">开启探索</button>
        </div>

        <!-- 答题页 -->
        <div class="card" id="quiz-page">
            <div class="q-header">
                <div class="q-label-row">
                    <span id="q-label">第 1 题</span>
                    <span id="q-count">1 / 40</span>
                </div>
                <div class="bar-bg"><div id="bar-fill"></div></div>
            </div>
            <div class="q-text" id="q-text">加载中...</div>
            <div class="options-group" id="options-box"></div>
        </div>

        <!-- 结果页 -->
        <div class="card" id="result-page">
            <div class="result-header">
                <div class="score-num" id="total-score">0</div>
                <div class="tag-pill" id="result-tag">--</div>
            </div>

            <div id="chart-container"><canvas id="radarChart"></canvas></div>

            <div class="advice-card">
                <div style="font-weight: bold; margin-bottom: 5px; color: var(--watermelon-red);">猪八吉深度解析：</div>
                <div id="baji-advice" style="font-size: 0.85rem;">分析计算中...</div>
            </div>

            <button class="btn-red" onclick="location.reload()" style="background: #EEE; color: #999;">重新测试</button>
        </div>
    </div>

    <script>
        const questions = [
            { t: "在完成枯燥任务时，你是否感到极度困难？", d: 0 },
            { t: "你是否经常在细节上犯粗心错误？", d: 0 },
            { t: "别人对你说话时，你是否显得心不在焉？", d: 0 },
            { t: "你是否经常丢三落四（如钥匙、手机）？", d: 1 },
            { t: "你是否经常难以组织和安排自己的任务？", d: 1 },
            { t: "你是否经常手脚动个不停，或在座位上扭动？", d: 3 },
            { t: "在被要求坐好的场合，你是否经常擅自离开座位？", d: 3 },
            { t: "你是否说话过多，有时停不下来？", d: 3 },
            { t: "你是否发现自己很难处理多线并行的复杂任务？", d: 1 },
            { t: "你是否觉得生活像一团乱麻，不知从何整理？", d: 1 },
            { t: "你是否经常感到情绪波动剧烈，且难以控制？", d: 2 },
            { t: "面对小挫折时，你是否容易感到极度沮丧？", d: 2 },
            { t: "你是否经常在截止日期临近时才爆发出动力？", d: 1 },
            { t: "在阅读长文时，你是否经常发现自己在走神？", d: 0 },
            { t: "你是否经常打断他人的谈话或活动？", d: 3 },
            { t: "你是否经常感到一种内在的、无法解释的焦虑？", d: 2 },
            { t: "你是否经常在寻找物品上花费大量时间？", d: 1 },
            { t: "你是否觉得大脑里像有很多频道在同时播放？", d: 0 },
            { t: "你是否经常通过购买新东西来获得短暂兴奋感？", d: 3 },
            { t: "你是否经常因为忘记重要的承诺而感到愧疚？", d: 1 },
            { t: "当环境嘈杂时，你是否发现很难集中精力？", d: 0 },
            { t: "你是否经常拖延那些‘看起来不难’的决定？", d: 1 },
            { t: "你是否经常感到自己像‘被马达驱动’一样忙个不停？", d: 3 },
            { t: "在排队等待时，你是否感到极度不耐烦？", d: 3 },
            { t: "你是否经常觉得自己的注意力无法随心所欲地转移？", d: 0 },
            { t: "你是否经常被家人抱怨‘做事没计划’？", d: 1 },
            { t: "在安静的环境中，你是否感到特别难受？", d: 3 },
            { t: "你是否容易被周围的情绪所感染或干扰？", d: 2 },
            { t: "你是否经常发现自己很难维持长期的习惯？", d: 1 },
            { t: "你是否经常在还没听清问题时就抢着回答？", d: 3 },
            { t: "你是否发现自己很难按照‘先后顺序’处理事情？", d: 1 },
            { t: "在对话中，你是否经常忘记自己刚才想说什么？", d: 0 },
            { t: "你是否经常感到一种莫名的‘紧迫感’？", d: 2 },
            { t: "你是否发现自己很容易过度投入一件有趣的事而忘记时间？", d: 0 },
            { t: "你是否经常感到自尊心受挫，觉得自己不如别人有条理？", d: 2 },
            { t: "在需要持续动脑的任务面前，你是否表现出厌恶？", d: 1 },
            { t: "你是否发现自己很容易丢掉‘谈话的主线’？", d: 0 },
            { t: "你是否经常感到自己的睡眠模式非常混乱？", d: 2 },
            { t: "你是否经常在不适当的场合感到‘坐立不安’？", d: 3 },
            { t: "你是否经常觉得时间不够用，且不知时间去哪了？", d: 1 }
        ];

        let idx = 0; let dScores = {0:0, 1:0, 2:0, 3:0};
        let canClick = true; // 状态锁，防止过快连续点击

        function startQuiz() {
            document.getElementById('start-page').style.display = 'none';
            document.getElementById('quiz-page').classList.add('fade-in');
            render();
        }

        function render() {
            const q = questions[idx];
            document.getElementById('q-text').innerText = q.t;
            // 修复计数器：明确更新这两个元素
            document.getElementById('q-label').innerText = `第 ${idx + 1} 题`;
            document.getElementById('q-count').innerText = `${idx + 1} / 40`;
            document.getElementById('bar-fill').style.width = `${((idx + 1) / 40) * 100}%`;

            const box = document.getElementById('options-box');
            box.innerHTML = '';
            ["从不", "很少", "有时", "经常", "总是"].forEach((l, s) => {
                const d = document.createElement('div');
                d.className = 'option-card';
                d.innerHTML = `<span>${l}</span><span class="score-hint">+${s}</span>`;
                d.onclick = function() {
                    if(!canClick) return;
                    canClick = false; // 锁定
                    this.classList.add('active'); // 高亮
                    
                    // 增加 600ms 思考延迟，让用户看清反馈
                    setTimeout(() => {
                        dScores[q.d] += s;
                        if(idx < 39){ 
                            idx++; 
                            render(); 
                            canClick = true; // 解锁
                        } else { 
                            result(); 
                        }
                    }, 600);
                };
                box.appendChild(d);
            });
        }

        function result() {
            document.getElementById('quiz-page').style.display = 'none';
            const resPage = document.getElementById('result-page');
            resPage.classList.add('fade-in');
            const total = Object.values(dScores).reduce((a,b)=>a+b, 0);
            document.getElementById('total-score').innerText = total;

            let tag = total <= 50 ? "低度倾向 · 稳健型" : (total <= 100 ? "中度倾向 · 分散型" : "高度倾向 · 活跃型");
            let advice = total <= 50 ? "你的思维非常有条理！这在亲密关系中是宝贵的‘定力’。" : "你的思维活跃但也容易陷入内耗。建议学习我们的手册，建立稳定的生活节律。";
            
            document.getElementById('result-tag').innerText = tag;
            document.getElementById('baji-advice').innerText = advice;
            
            // 显示图表并初始化
            document.getElementById('chart-container').style.display = 'block';
            setTimeout(() => {
                const ctx = document.getElementById('radarChart').getContext('2d');
                new Chart(ctx, {
                    type: 'radar',
                    data: {
                        labels: ['专注', '执行', '情绪', '冲动'],
                        datasets: [{
                            data: [dScores[0], dScores[1], dScores[2], dScores[3]],
                            backgroundColor: 'rgba(255, 91, 103, 0.15)',
                            borderColor: '#FF5B67', borderWidth: 2, pointRadius: 2
                        }]
                    },
                    options: { scales: { r: { beginAtZero: true, ticks: { display: false }, grid: { color: '#EEE' } } }, plugins: { legend: { display: false } } }
                });
            }, 300);
        }
    </script>
</body>
</html>
