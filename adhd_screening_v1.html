<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>猪八吉爱媳妇 | 测评中心</title>
    <!-- 极速加载图表库 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        :root {
            --bg-linen: #FAF7F2;      
            --card-white: #FFFFFF;
            --watermelon-red: #FF5B67; /* 醒目的西瓜红 */
            --text-walnut: #5D524A;   
            --text-sand: #9E8E85;     
            --soft-shadow: 0 10px 30px rgba(255, 91, 103, 0.08);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, "PingFang SC", sans-serif;
            background-color: var(--bg-linen);
            color: var(--text-walnut);
            margin: 0; padding: 0;
            overflow-x: hidden;
            line-height: 1.5;
        }

        /* 极致压缩 Header 高度 */
        .brand-header {
            padding: 15px 20px 10px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .baji-logo {
            width: 32px; height: 32px; border-radius: 50%; overflow: hidden;
            border: 1px solid #EEE;
        }
        .baji-logo img { width: 100%; height: 100%; object-fit: cover; }
        
        .brand-info h1 { font-size: 1.1rem; margin: 0; color: var(--text-walnut); font-weight: 600; }
        /* 研究所：变西瓜红、放大、加粗 */
        .brand-info p { 
            font-size: 0.85rem; margin: 0; 
            color: var(--watermelon-red); 
            font-weight: bold; letter-spacing: 1px;
        }

        .container {
            width: 100%; max-width: 500px;
            margin: 0 auto; padding: 5px 15px 20px;
        }

        /* 压缩卡片内边距，确保一屏显示 */
        .card {
            background: var(--card-white);
            padding: 25px 20px;
            border-radius: 28px;
            box-shadow: var(--soft-glow);
            display: none;
            min-height: auto;
        }

        .fade-in { display: block; animation: smoothSlide 0.5s ease-out forwards; }
        @keyframes smoothSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 封面压缩 */
        #start-page { text-align: center; }
        .main-title { font-size: 1.3rem; margin-bottom: 10px; color: var(--text-walnut); }
        .quote-box { font-size: 0.8rem; color: var(--text-sand); margin: 15px 0; }

        /* 答题区：第x题、紧凑布局 */
        .q-header { margin-bottom: 20px; }
        .q-label-row { 
            font-size: 0.85rem; color: var(--watermelon-red); 
            margin-bottom: 8px; font-weight: bold;
            display: flex; justify-content: space-between;
        }
        .bar-bg { width: 100%; height: 3px; background: #EEE; border-radius: 2px; }
        #bar-fill { height: 100%; background: var(--watermelon-red); width: 0%; transition: width 0.3s; }
        
        .q-text { 
            font-size: 1.1rem; font-weight: 600; 
            margin-bottom: 20px; color: var(--text-walnut); 
            min-height: 50px; line-height: 1.4;
        }

        /* 选项按钮：点击变西瓜红 */
        .options-group { display: flex; flex-direction: column; gap: 10px; }
        .option-card {
            width: 100%; padding: 14px 20px;
            border: 1px solid #F0EEEA;
            border-radius: 15px; background: #FCFAF8;
            cursor: pointer; display: flex;
            justify-content: space-between; align-items: center;
            transition: all 0.2s; color: var(--text-walnut);
            font-size: 0.95rem;
        }
        /* 点击时的激活状态 */
        .option-card.active {
            background: var(--watermelon-red) !important;
            color: #FFF !important;
            border-color: var(--watermelon-red);
            transform: scale(0.98);
        }
        .score-hint { font-size: 0.6rem; opacity: 0.5; }

        /* 结果页布局 */
        .result-header { text-align: center; margin-bottom: 20px; }
        .score-num { font-size: 3.5rem; font-weight: bold; color: var(--watermelon-red); line-height: 1; }
        .tag-pill { display: inline-block; padding: 4px 12px; background: #FFF5F6; color: var(--watermelon-red); border-radius: 50px; font-size: 0.75rem; margin-top: 10px; }

        .advice-card {
            background: #FCFAF8; padding: 20px;
            border-radius: 18px; margin: 20px 0;
            line-height: 1.6; font-size: 0.9rem;
            color: var(--text-walnut); border: 1px solid #EEE;
        }

        .btn-red {
            background: var(--watermelon-red);
            color: #FFF; border: none; padding: 15px; border-radius: 50px;
            font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%;
        }

        .res-item {
            display: flex; align-items: center; gap: 12px;
            background: white; padding: 15px; border-radius: 18px;
            margin-bottom: 10px; text-decoration: none; color: inherit;
            border: 1px solid #EEE;
        }
        .res-icon { font-size: 1.2rem; }
        .res-info h4 { margin: 0; font-size: 0.9rem; color: var(--watermelon-red); }
        .res-info p { margin: 0; font-size: 0.7rem; color: var(--text-sand); }

        .qr-section { text-align: center; margin-top: 25px; font-size: 0.8rem; }
        .qr-img { width: 110px; height: 110px; background: #EEE; margin: 10px auto; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    </style>
</head>
<body>

    <header class="brand-header">
        <div class="baji-logo">
            <img src="https://jasmine2025888.github.io/love-language-translator/assets/logo.png" alt="猪八吉">
        </div>
        <div class="brand-info">
            <h1>猪八吉爱媳妇</h1>
            <p>中国式亲密关系研究所</p>
        </div>
    </header>

    <div class="container">
        <!-- 封面 -->
        <div class="card fade-in" id="start-page">
            <h2 class="main-title">ADHD多维度深度筛查量表</h2>
            <div class="quote-box">“实用、接地气的情感成长工具”</div>
            <p style="font-size: 0.8rem; color: var(--text-sand); margin-bottom: 25px;">
                本量表由「猪八吉爱媳妇」研究所优化，助你深度识别思维偏好。
            </p>
            <button class="btn-red" onclick="startQuiz()">开启深度探索</button>
        </div>

        <!-- 答题页：高度压缩版 -->
        <div class="card" id="quiz-page">
            <div class="q-header">
                <div class="q-label-row">
                    <span id="q-label">第 1 题</span>
                    <span>1 / 40</span>
                </div>
                <div class="bar-bg"><div id="bar-fill"></div></div>
            </div>
            <div class="q-text" id="q-text">Loading...</div>
            <div class="options-group" id="options-box"></div>
        </div>

        <!-- 结果页 -->
        <div class="card" id="result-page">
            <div class="result-header">
                <div class="score-num" id="total-score">0</div>
                <div class="tag-pill" id="result-tag">--</div>
            </div>

            <!-- 可视化雷达 -->
            <div style="max-width: 260px; margin: 0 auto 20px;">
                <canvas id="radarChart"></canvas>
            </div>

            <div class="advice-card">
                <div style="font-weight: bold; margin-bottom: 8px; color: var(--watermelon-red);">猪八吉深度解析：</div>
                <div id="baji-advice" style="font-size: 0.85rem; line-height: 1.5;"></div>
            </div>

            <div class="res-item">
                <div class="res-icon">📖</div>
                <div class="res-info">
                    <h4>《猪八吉爱媳妇亲密关系手册》</h4>
                    <p>系统化自我管理指南</p>
                </div>
            </div>

            <div class="qr-section">
                <p>添加猪八吉 · 领取深度分析</p>
                <div class="qr-img"><img src="your-qr-image.png" alt="QR" style="width:80%; opacity:0.1"></div>
            </div>

            <button class="btn-red" onclick="location.reload()" style="margin-top: 20px; background: #EEE; color: #999;">重新开始</button>
        </div>
    </div>

    <script>
        const questions = [
            { t: "在完成枯燥或重复性任务时，你是否感到极度困难？", d: 0 },
            { t: "你是否经常在需要关注细节时表现得不细心，常犯粗心错误？", d: 0 },
            { t: "当别人直接对你说话时，你是否经常显得心不在焉？", d: 0 },
            { t: "你是否经常无法按指示完成任务，导致工作/家务半途而废？", d: 1 },
            { t: "你是否经常难以组织和安排自己的任务和活动？", d: 1 },
            { t: "你是否经常回避、厌恶或不情愿去做需要持续动脑的任务？", d: 1 },
            { t: "你是否经常丢失任务或活动所需的物品（手机、钥匙）？", d: 1 },
            { t: "你是否经常容易被外界刺激干扰而分心？", d: 0 },
            { t: "你是否在日常活动中经常忘记缴费、约会等琐事？", d: 1 },
            { t: "你是否发现自己很难从一个活动切换到另一个活动？", d: 0 },
            { t: "你是否经常手脚动个不停，或在座位上扭动？", d: 3 },
            { t: "在被要求坐好的场合，你是否经常擅自离开座位？", d: 3 },
            { t: "你是否经常在不适当的场合感到坐立不安或想跑动？", d: 3 },
            { t: "你是否经常难以安静地参加休闲活动？", d: 3 },
            { t: "你是否经常表现得像“被马达驱动”一样忙个不停？", d: 3 },
            { t: "你是否经常说话过多，有时停不下来？", d: 3 },
            { t: "在问题还没问完时，你是否经常抢着回答？", d: 3 },
            { t: "在需要排队轮候时，你是否经常感到极度不耐烦？", d: 3 },
            { t: "你是否经常打断他人的对话或强行加入他人活动？", d: 3 },
            { t: "你是否经常在还没想清楚后果前就采取行动？", d: 3 },
            { t: "你是否经常感到情绪波动剧烈，且难以控制？", d: 2 },
            { t: "你是否发现自己很容易因为一点小挫折而感到极度沮丧？", d: 2 },
            { t: "你是否经常感到一种内在的、无法解释的焦虑感？", d: 2 },
            { t: "你是否经常拖延那些看起来并不难处理的决定？", d: 1 },
            { t: "你是否发现自己很难维持长期的兴趣或习惯？", d: 1 },
            { t: "你是否经常在对话中忘记自己刚才想说什么？", d: 0 },
            { t: "你是否经常在寻找物品上花费大量时间？", d: 1 },
            { t: "你是否感觉自己的睡眠模式非常混乱？", d: 2 },
            { t: "你是否经常被家人或朋友抱怨“做事没计划”？", d: 1 },
            { t: "你是否经常在截止日期临近时才爆发出惊人的动力？", d: 1 },
            { t: "你是否经常感到自己的大脑像有很多个频道在同时播放？", d: 0 },
            { t: "你是否发现自己很难处理多线并行的复杂任务？", d: 1 },
            { t: "你是否经常在阅读长篇文章时发现自己一直在走神？", d: 0 },
            { t: "你是否经常因为过度投入某件有趣的事而忘记时间？", d: 0 },
            { t: "你是否经常感到自己的情绪很容易受周围环境影响？", d: 2 },
            { t: "你是否经常感到自尊心受挫，觉得自己不如同龄人有条理？", d: 2 },
            { t: "你是否经常因为忘记重要的承诺而感到愧疚？", d: 1 },
            { t: "你是否经常通过购买新东西来获得短暂的兴奋感？", d: 3 },
            { t: "你是否经常在安静的环境中感到特别难受？", d: 3 },
            { t: "你是否经常觉得生活像一团乱麻，不知从何整理？", d: 1 }
        ];

        let idx = 0; let dScores = {0:0, 1:0, 2:0, 3:0};

        function startQuiz() {
            document.getElementById('start-page').style.display = 'none';
            document.getElementById('quiz-page').classList.add('fade-in');
            show();
        }

        function show() {
            const q = questions[idx];
            document.getElementById('q-text').innerText = q.t;
            document.getElementById('q-label').innerText = `第 ${idx + 1} 题`;
            document.getElementById('bar-fill').style.width = `${((idx + 1) / 40) * 100}%`;

            const box = document.getElementById('options-box');
            box.innerHTML = '';
            ["从不", "很少", "有时", "经常", "总是"].forEach((l, s) => {
                const d = document.createElement('div');
                d.className = 'option-card';
                d.innerHTML = `<span>${l}</span><span class="score-hint">+${s}</span>`;
                d.onclick = function() {
                    // 点击反馈逻辑
                    this.classList.add('active');
                    setTimeout(() => {
                        dScores[q.d] += s;
                        if(idx < 39){ idx++; show(); } else { result(); }
                    }, 150);
                };
                box.appendChild(d);
            });
        }

        function result() {
            document.getElementById('quiz-page').style.display = 'none';
            document.getElementById('result-page').classList.add('fade-in');
            const total = Object.values(dScores).reduce((a,b)=>a+b, 0);
            document.getElementById('total-score').innerText = total;

            let tag = ""; let advice = "";
            if(total <= 50) { tag = "低度倾向 · 稳健型"; advice = "你的思维极具条理性，是亲密关系中的定海神针。"; }
            else if(total <= 100) { tag = "中度倾向 · 分散型"; advice = "你的思维活跃但易内耗，建议建立更稳定的生活节奏。"; }
            else { tag = "高度倾向 · 活跃型"; advice = "你的大脑风暴永不停歇，建议寻求专业评估并接纳自我。"; }

            document.getElementById('result-tag').innerText = tag;
            document.getElementById('baji-advice').innerText = advice;
            
            // 初始化雷达图
            const ctx = document.getElementById('radarChart').getContext('2d');
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['专注', '执行', '情绪', '冲动'],
                    datasets: [{
                        data: [dScores[0], dScores[1], dScores[2], dScores[3]],
                        backgroundColor: 'rgba(255, 91, 103, 0.2)',
                        borderColor: '#FF5B67',
                        borderWidth: 2, pointRadius: 0
                    }]
                },
                options: {
                    scales: { r: { beginAtZero: true, ticks: { display: false }, grid: { color: '#EEE' } } },
                    plugins: { legend: { display: false } }
                }
            });
        }
    </script>
</body>
</html>
