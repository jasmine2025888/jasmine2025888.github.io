<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猪八吉爱媳妇 | ADHD深度探索</title>
    <style>
        :root {
            /* 鼠尾草绿 & 燕麦系高级色盘 */
            --bg-oatmeal: #F8F5F2;    /* 背景：燕麦色 */
            --card-pure: #FFFFFF;     /* 卡片：纯白 */
            --sage-green: #9EA89E;    /* 强调：鼠尾草绿 */
            --text-slate: #4A4543;    /* 文字：暖石灰 (深而不沉) */
            --text-sub: #A29C98;      /* 辅助：淡泥色 */
            --btn-cream: #FDFBFA;     /* 选项：奶油白 */
            --accent-sand: #D9A08B;   /* 辅色：陶土沙 */
            --diffused-shadow: 0 20px 60px rgba(74, 69, 67, 0.05); /* 弥散阴影 */
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: "Optima", "PingFang SC", "Hiragino Sans GB", sans-serif;
            background-color: var(--bg-oatmeal);
            color: var(--text-slate);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            line-height: 2; /* 增加行高，提升呼吸感 */
        }

        /* 顶部品牌区 - 悬浮透明感 */
        .brand-header {
            padding: 40px 20px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .baji-logo {
            width: 44px; height: 44px; border-radius: 16px;
            overflow: hidden; background: #FFF;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .baji-logo img { width: 100%; height: 100%; object-fit: cover; }
        .brand-info h1 { 
            font-size: 1.3rem; margin: 0; 
            letter-spacing: 2px; font-weight: 500;
        }
        .brand-info p { 
            font-size: 0.75rem; margin: 0; 
            color: var(--text-sub); letter-spacing: 3px;
        }

        .container {
            flex: 1; width: 100%; max-width: 540px;
            margin: 0 auto; padding: 10px 24px 80px;
        }

        /* 无边框卡片设计 */
        .card {
            background: var(--card-pure);
            padding: 50px 40px;
            border-radius: 32px;
            box-shadow: var(--diffused-shadow);
            display: none;
            transition: all 0.6s ease;
        }

        .fade-in { display: block; animation: smoothReveal 0.8s forwards; }
        @keyframes smoothReveal {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 封面页内容 */
        #start-page { text-align: center; }
        .quote-text {
            font-size: 0.9rem; color: var(--text-sub);
            margin: 45px 0; font-style: italic; letter-spacing: 1px;
        }
        .main-title { font-size: 1.6rem; font-weight: 500; margin-bottom: 15px; }

        /* 答题区核心交互 */
        .q-header { margin-bottom: 50px; }
        .q-num { 
            font-size: 0.75rem; color: var(--sage-green); 
            font-weight: 600; letter-spacing: 2px;
            margin-bottom: 15px; display: block;
        }
        .progress-track { width: 100%; height: 3px; background: #F0EEEA; border-radius: 2px; }
        #progress-fill { height: 100%; background: var(--sage-green); width: 0%; transition: width 0.8s ease; }
        
        .q-text { font-size: 1.3rem; font-weight: 500; margin-bottom: 45px; min-height: 90px; }

        .options-list { display: flex; flex-direction: column; gap: 16px; }
        .option-pill {
            width: 100%; padding: 22px 30px;
            border-radius: 20px; background: var(--btn-cream);
            cursor: pointer; display: flex;
            justify-content: space-between; align-items: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-slate); border: 1px solid transparent;
        }
        .option-pill:hover { 
            background: #FFF; 
            box-shadow: 0 10px 30px rgba(158, 168, 158, 0.15);
            transform: translateY(-2px);
            color: var(--sage-green);
        }
        .score-tag { font-size: 0.7rem; color: var(--text-sub); opacity: 0.6; }

        /* 结果页 - 杂志化排版 */
        .res-header { text-align: center; margin-bottom: 40px; }
        .score-big { font-size: 4.5rem; font-weight: 300; color: var(--text-slate); margin: 10px 0; }
        .res-badge { 
            display: inline-block; padding: 6px 20px; 
            background: #F2F4F2; color: var(--sage-green); 
            border-radius: 50px; font-size: 0.8rem; font-weight: 600;
        }

        .baji-box {
            background: var(--bg-oatmeal);
            padding: 35px; border-radius: 24px;
            margin: 30px 0; line-height: 2;
            font-size: 0.95rem; color: var(--text-slate);
            position: relative;
        }
        .baji-box::before {
            content: "“"; position: absolute; top: 10px; left: 20px;
            font-size: 3rem; color: var(--sage-green); opacity: 0.2;
        }

        /* 生态模块 */
        .res-card { margin-top: 50px; padding-top: 40px; }
        .res-item {
            display: flex; align-items: center; gap: 20px;
            background: white; padding: 25px; border-radius: 24px;
            margin-bottom: 18px; text-decoration: none; color: inherit;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            transition: all 0.3s;
        }
        .res-item:hover { transform: translateY(-3px); box-shadow: var(--diffused-shadow); }
        .res-icon { font-size: 1.5rem; width: 50px; height: 50px; background: #F8F5F2; border-radius: 15px; display: flex; align-items: center; justify-content: center; }
        .res-txt h4 { margin: 0 0 4px; color: var(--sage-green); font-size: 1rem; }
        .res-txt p { margin: 0; font-size: 0.75rem; color: var(--text-sub); }

        .btn-sage {
            background: var(--sage-green);
            color: #FFF; border: none; padding: 22px; border-radius: 50px;
            font-size: 1rem; letter-spacing: 4px; cursor: pointer; width: 100%;
            transition: all 0.3s; box-shadow: 0 10px 30px rgba(158, 168, 158, 0.2);
        }
        .btn-sage:hover { opacity: 0.9; transform: scale(1.01); }

        .qr-area { text-align: center; margin-top: 50px; }
        .qr-placeholder { 
            width: 140px; height: 140px; background: #FFF; 
            margin: 20px auto; border-radius: 24px; 
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.03); overflow: hidden;
        }
    </style>
</head>
<body>

    <header class="brand-header">
        <div class="baji-logo">
            <img src="https://jasmine2025888.github.io/love-language-translator/assets/logo.png" alt="猪八吉" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23F2F4F2%22/><text y=%22.75em%22 x=%2250%25%22 text-anchor=%22middle%22 font-size=%2260%22>🐷</text></svg>'">
        </div>
        <div class="brand-info">
            <h1>猪八吉爱媳妇</h1>
            <p>中国式亲密关系研究所</p>
        </div>
    </header>

    <div class="container">
        <!-- 开始页 -->
        <div class="card fade-in" id="start-page">
            <h2 class="main-title">ADHD多维度深度筛查量表</h2>
            <div class="quote-text">
                “专注中国式亲密关系，提供实用、接地气的情感成长工具。”
            </div>
            <p style="font-size: 0.85rem; color: var(--text-sub); text-align: justify; margin-bottom: 50px;">
                本量表由「猪八吉爱媳妇」研究所基于 ASRS 临床标准优化。我们相信，深度识别思维偏好是开启自我接纳与关系修复的第一步。
            </p>
            <button class="btn-sage" onclick="startQuiz()">开启深度探索</button>
        </div>

        <!-- 答题页 -->
        <div class="card" id="quiz-page">
            <div class="q-header">
                <span class="q-num" id="q-label">第 01 题</span>
                <div class="progress-track"><div id="progress-fill"></div></div>
            </div>
            <div class="q-text" id="q-text">Loading...</div>
            <div class="options-list" id="options-box"></div>
        </div>

        <!-- 结果页 -->
        <div class="card" id="result-page">
            <div class="res-header">
                <span class="res-badge">测试报告报告 · REPORT</span>
                <div class="score-big" id="total-score">0</div>
                <p id="result-tag" style="letter-spacing: 2px; font-weight: 500; color: var(--sage-green);"></p>
            </div>

            <div class="baji-box">
                <div style="font-weight: 600; margin-bottom: 12px; color: var(--sage-green);">猪八吉的深度解析：</div>
                <div id="baji-advice"></div>
            </div>

            <div class="res-card">
                <a href="#" class="res-item">
                    <div class="res-icon">📖</div>
                    <div class="res-txt">
                        <h4>《猪八吉爱媳妇亲密关系手册》</h4>
                        <p>将认知转化为行动的系统指南</p>
                    </div>
                </a>
                <a href="#" class="res-item">
                    <div class="res-icon">💬</div>
                    <div class="res-txt">
                        <h4>猪八吉疗愈社群</h4>
                        <p>在这里，遇见同频的成长伙伴</p>
                    </div>
                </a>
            </div>

            <div class="qr-area">
                <p style="font-size: 0.8rem; color: var(--text-sub); letter-spacing: 1px;">添加猪八吉 · 领取深度分析建议</p>
                <div class="qr-placeholder">
                    <img src="your-qr-code.png" alt="微信二维码" style="width:80%; opacity:0.5;">
                </div>
                <p style="font-size: 0.7rem; color: var(--text-sub);">小红书 / 微信：猪八吉爱媳妇</p>
            </div>

            <button class="btn-sage" onclick="location.reload()" style="margin-top: 50px; background: transparent; color: var(--text-sub); box-shadow: none;">重新测试</button>
        </div>
    </div>

    <script>
        const questions = [
            { t: "在完成枯燥或重复性任务时，你是否感到极度困难？" },
            { t: "你是否经常在需要关注细节时表现得不细心，常犯粗心错误？" },
            { t: "当别人直接对你说话时，你是否经常显得心不在焉？" },
            { t: "你是否经常无法按指示完成任务，导致工作/家务半途而废？" },
            { t: "你是否经常难以组织和安排自己的任务和活动？" },
            { t: "你是否经常回避、厌恶或不情愿去做需要持续动脑的任务？" },
            { t: "你是否经常丢失任务或活动所需的物品（手机、钥匙）？" },
            { t: "你是否经常容易被外界刺激干扰而分心？" },
            { t: "你是否在日常活动中经常忘记缴费、约会等琐事？" },
            { t: "你是否发现自己很难从一个活动切换到另一个活动？" },
            { t: "你是否经常手脚动个不停，或在座位上扭动？" },
            { t: "在被要求坐好的场合，你是否经常擅自离开座位？" },
            { t: "你是否经常在不适当的场合感到坐立不安或想跑动？" },
            { t: "你是否经常难以安静地参加休闲活动？" },
            { t: "你是否经常表现得像“被马达驱动”一样忙个不停？" },
            { t: "你是否经常说话过多，有时停不下来？" },
            { t: "在问题还没问完时，你是否经常抢着回答？" },
            { t: "在需要排队轮候时，你是否经常感到极度不耐烦？" },
            { t: "你是否经常打断他人的对话或强行加入他人活动？" },
            { t: "你是否经常在还没想清楚后果前就采取行动？" },
            { t: "你是否经常感到情绪波动剧烈，且难以控制？" },
            { t: "你是否发现自己很容易因为一点小挫折而感到极度沮丧？" },
            { t: "你是否经常感到一种内在的、无法解释的焦虑感？" },
            { t: "你是否经常拖延那些看起来并不难处理的决定？" },
            { t: "你是否发现自己很难维持长期的兴趣或习惯？" },
            { t: "你是否经常在对话中忘记自己刚才想说什么？" },
            { t: "你是否经常在寻找物品上花费大量时间？" },
            { t: "你是否感觉自己的睡眠模式非常混乱？" },
            { t: "你是否经常被家人或朋友抱怨“做事没计划”？" },
            { t: "你是否经常在截止日期临近时才爆发出惊人的动力？" },
            { t: "你是否经常感到自己的大脑像有很多个频道在同时播放？" },
            { t: "你是否发现自己很难处理多线并行的复杂任务？" },
            { t: "你是否经常在阅读长篇文章时发现自己一直在走神？" },
            { t: "你是否经常因为过度投入某件有趣的事而忘记时间？" },
            { t: "你是否经常感到自己的情绪很容易受周围环境影响？" },
            { t: "你是否经常感到自尊心受挫，觉得自己不如同龄人有条理？" },
            { t: "你是否经常因为忘记重要的承诺而感到愧疚？" },
            { t: "你是否经常通过购买新东西来获得短暂的兴奋感？" },
            { t: "你是否经常在安静的环境中感到特别难受？" },
            { t: "你是否经常觉得生活像一团乱麻，不知从何整理？" }
        ];

        const optionLabels = ["从未如此", "很少发生", "有时发生", "经常发生", "总是发生"];
        let idx = 0; let total = 0;

        function startQuiz() {
            document.getElementById('start-page').style.display = 'none';
            const quizPage = document.getElementById('quiz-page');
            quizPage.classList.add('fade-in');
            show();
        }

        function show() {
            const q = questions[idx];
            const qT = document.getElementById('q-text');
            qT.style.opacity = 0;
            setTimeout(() => { 
                qT.innerText = q.t; 
                qT.style.opacity = 1; 
            }, 200);

            document.getElementById('q-label').innerText = `第 ${String(idx + 1).padStart(2, '0')} 题`;
            document.getElementById('progress-fill').style.width = `${((idx + 1) / 40) * 100}%`;

            const box = document.getElementById('options-box');
            box.innerHTML = '';
            optionLabels.forEach((label, s) => {
                const d = document.createElement('div');
                d.className = 'option-pill';
                d.innerHTML = `<span>${label}</span><span class="score-tag">+${s}分</span>`;
                d.onclick = () => { total += s; if(idx < 39){ idx++; show(); } else { result(); } };
                box.appendChild(d);
            });
        }

        function result() {
            document.getElementById('quiz-page').style.display = 'none';
            const resultPage = document.getElementById('result-page');
            resultPage.classList.add('fade-in');
            document.getElementById('total-score').innerText = total;

            let tag = ""; let advice = "";
            if (total <= 50) {
                tag = "低度倾向 · 思维稳健";
                advice = "你的思维极具条理性。这种‘定力’是中国式亲密关系中非常宝贵的特质，能为伴侣带来极大的安全感。建议继续关注我们的成长手册，将这份定力转化为深度的情感滋养力。";
            } else if (total <= 100) {
                tag = "中度倾向 · 能量分散";
                advice = "你的思维活跃但有时会陷入‘精力内耗’。这种倾向在亲密关系中可能表现为：答应的事忘记做、沟通时容易分心。猪八吉建议你不要自责，试着使用我们手册中的‘接地气’管理工具，和伴侣一起建立更稳定的生活节奏。";
            } else {
                tag = "高度倾向 · 建议评估";
                advice = "你的大脑里可能正进行着一场永不停歇的‘风暴’。这让你极具创意和热情，但也可能让你在琐碎的生活中感到筋疲力尽。猪八吉建议你寻求专业评估，同时加入我们的疗愈社群。在这里，我们会陪你一起梳理那些‘乱如麻’的情绪，找回掌控感。";
            }

            document.getElementById('result-tag').innerText = tag;
            document.getElementById('baji-advice').innerText = advice;
        }
    </script>
</body>
</html>
