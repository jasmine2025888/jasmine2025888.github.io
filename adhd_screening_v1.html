<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猪八吉爱媳妇 | ADHD深度探索</title>
    <style>
        :root {
            /* 暖木红棕色系 */
            --bg-linen: #FAF7F2;      
            --card-white: #FFFFFF;
            --text-red-brown: #8C4332; /* 暖红棕色 - 标题与重点 */
            --text-coffee: #6B5446;    /* 咖啡色 - 正文与边框 */
            --text-grey: #96928E;      /* 灰色 - 辅助说明 */
            --accent-terracotta: #D4A373; 
            --soft-glow: 0 10px 30px rgba(107, 84, 70, 0.04);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: "PingFang SC", "Hiragino Sans GB", "Heiti SC", sans-serif;
            background-color: var(--bg-linen);
            color: var(--text-coffee);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            line-height: 1.8;
        }

        /* 顶部品牌区 */
        .brand-header {
            padding: 40px 20px 20px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .baji-logo {
            width: 44px; height: 44px; border-radius: 50%;
            overflow: hidden; background: #FFF;
            border: 2px solid var(--text-coffee);
        }
        .baji-logo img { width: 100%; height: 100%; object-fit: cover; }
        
        .brand-info h1 { 
            font-size: 1.3rem; margin: 0; 
            letter-spacing: 2px;
            color: var(--text-red-brown);
            font-weight: 600;
        }
        .brand-info p { 
            font-size: 0.75rem; margin: 2px 0 0 0; 
            color: var(--text-grey); 
            letter-spacing: 3px;
        }

        .container {
            flex: 1; width: 100%; max-width: 520px;
            margin: 0 auto; padding: 10px 24px 80px 24px;
        }

        /* 卡片设计 */
        .card {
            background: var(--card-white);
            padding: 50px 35px;
            border-radius: 36px;
            box-shadow: var(--soft-glow);
            border: 2px solid var(--text-coffee); /* 加粗边框 */
            display: none;
        }

        .fade-in { display: block; animation: smoothSlide 0.6s forwards; }
        @keyframes smoothSlide {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 封面 */
        #start-page { text-align: center; }
        .main-title { font-size: 1.6rem; margin-bottom: 25px; color: var(--text-red-brown); font-weight: 600; }
        .quote-box {
            font-size: 0.9rem; color: var(--text-grey);
            margin: 40px 0; padding: 0 15px;
            border-left: 2px solid var(--accent-terracotta);
        }

        /* 答题区 */
        .progress-section { margin-bottom: 40px; }
        .progress-label { 
            font-size: 0.85rem; color: var(--text-red-brown); 
            margin-bottom: 12px; font-weight: 600;
            display: flex; justify-content: space-between;
        }
        .bar-bg { width: 100%; height: 4px; background: #EEE; border-radius: 2px; }
        #bar-fill { height: 100%; background: var(--text-red-brown); width: 0%; transition: width 0.4s; }
        
        .q-text { font-size: 1.25rem; font-weight: 600; margin-bottom: 40px; color: var(--text-coffee); min-height: 80px; }

        .options-group { display: flex; flex-direction: column; gap: 14px; }
        .option-card {
            width: 100%; padding: 20px 25px;
            border: 2px solid var(--text-coffee); /* 边框加粗 */
            border-radius: 18px; background: #FFF;
            cursor: pointer; display: flex;
            justify-content: space-between; align-items: center;
            transition: all 0.2s; color: var(--text-coffee);
            font-weight: 500;
        }
        .option-card:hover { background: var(--bg-linen); transform: scale(1.02); }
        .score-hint { font-size: 0.7rem; color: var(--text-grey); font-weight: 400; }

        /* 结果页 */
        .result-header { text-align: center; margin-bottom: 40px; }
        .score-num { font-size: 4.5rem; font-weight: 600; color: var(--text-red-brown); line-height: 1; margin: 15px 0; }
        .tag-pill { 
            display: inline-block; padding: 6px 20px; 
            border: 1.5px solid var(--text-red-brown);
            color: var(--text-red-brown); border-radius: 50px; 
            font-size: 0.8rem; font-weight: 600;
        }

        .advice-card {
            background: #FAF9F7; padding: 25px;
            border-radius: 20px; margin: 30px 0;
            line-height: 1.8; font-size: 0.95rem;
            color: var(--text-coffee); border: 2px solid var(--text-coffee);
        }

        /* 引导资源 - 强化边框 */
        .resource-section { margin-top: 50px; border-top: 2px dashed var(--text-coffee); padding-top: 40px; }
        .res-title { font-size: 0.9rem; color: var(--text-red-brown); text-align: center; margin-bottom: 30px; font-weight: 600; }
        .res-item {
            display: flex; align-items: center; gap: 15px;
            background: white; padding: 20px; border-radius: 22px;
            margin-bottom: 16px; text-decoration: none; color: inherit;
            border: 2px solid var(--text-coffee); /* 强化边框 */
            transition: all 0.3s;
        }
        .res-item:hover { background: var(--bg-linen); transform: translateY(-3px); }
        .res-icon { font-size: 1.4rem; }
        .res-info h4 { margin: 0 0 4px 0; font-size: 1rem; color: var(--text-red-brown); }
        .res-info p { margin: 0; font-size: 0.75rem; color: var(--text-grey); }

        .btn-main {
            background: var(--text-red-brown);
            color: #FFF; border: none; padding: 20px; border-radius: 50px;
            font-size: 1.1rem; font-weight: 600; cursor: pointer; width: 100%;
            transition: all 0.3s;
        }
        .btn-main:hover { opacity: 0.9; }

        .qr-section { text-align: center; margin-top: 40px; }
        .qr-container { 
            width: 140px; height: 140px; background: #FFF; 
            margin: 20px auto; border-radius: 16px; 
            border: 2px solid var(--text-coffee); 
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <header class="brand-header">
        <div class="baji-logo">
            <img src="https://jasmine2025888.github.io/love-language-translator/assets/logo.png" alt="猪八吉" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.8em%22 x=%2250%25%22 text-anchor=%22middle%22 font-size=%2260%22>🐷</text></svg>'">
        </div>
        <div class="brand-info">
            <h1>猪八吉爱媳妇</h1>
            <p>中国式亲密关系研究所</p>
        </div>
    </header>

    <div class="container">
        <!-- 封面 -->
        <div class="card fade-in" id="start-page">
            <h2 class="main-title">ADHD多维度深度筛查量表</h2>
            <div class="quote-box">
                “专注中国式亲密关系，提供实用、接地气的情感成长工具。”
            </div>
            <p style="font-size: 0.9rem; color: var(--text-grey); margin-bottom: 50px;">
                本量表由「猪八吉爱媳妇」基于 ASRS 临床标准优化，旨在帮助你深度识别思维偏好，探索大脑的“活跃边界”。
            </p>
            <button class="btn-main" onclick="startQuiz()">开启深度探索</button>
        </div>

        <!-- 答题 -->
        <div class="card" id="quiz-page">
            <div class="progress-section">
                <div class="progress-label">
                    <span id="q-label">第 1 题</span>
                    <span>1 / 40</span>
                </div>
                <div class="bar-bg"><div id="bar-fill"></div></div>
            </div>
            <div class="q-text" id="q-text">加载中...</div>
            <div class="options-group" id="options-box"></div>
        </div>

        <!-- 结果 -->
        <div class="card" id="result-page">
            <div class="result-header">
                <span class="tag-pill">测试报告</span>
                <div class="score-num" id="total-score">0</div>
                <p id="result-tag" style="font-weight: 600; font-size: 1.1rem; color: var(--text-coffee);"></p>
            </div>

            <div class="advice-card">
                <div style="font-weight: bold; margin-bottom: 15px; color: var(--text-red-brown);">猪八吉的深度解析：</div>
                <div id="baji-advice"></div>
            </div>

            <div class="resource-section">
                <div class="res-title">核心成长资源</div>
                <a href="#" class="res-item">
                    <div class="res-icon">📖</div>
                    <div class="res-info">
                        <h4>《猪八吉爱媳妇亲密关系手册》</h4>
                        <p>将认知转化为行动的系统指南</p>
                    </div>
                </a>
                <a href="#" class="res-item">
                    <div class="res-icon">💬</div>
                    <div class="res-info">
                        <h4>猪八吉疗愈社群</h4>
                        <p>在这里，遇见同频的成长伙伴</p>
                    </div>
                </a>
            </div>

            <div class="qr-section">
                <p style="font-size: 0.9rem; font-weight: 600;">添加猪八吉 · 领取深度分析建议</p>
                <div class="qr-container">
                    <img src="your-qr-code.png" alt="微信二维码">
                </div>
                <p style="font-size: 0.75rem; color: var(--text-grey);">小红书 / 微信：猪八吉爱媳妇</p>
            </div>

            <button class="btn-main" onclick="location.reload()" style="margin-top: 40px; background: transparent; border: 2px solid var(--text-grey); color: var(--text-grey);">重新开始</button>
        </div>
    </div>

    <script>
        const questions = [
            { t: "在完成枯燥或重复性任务时，你是否感到极度困难？" },
            { t: "你是否经常在需要关注细节时表现得不细心，常犯粗心错误？" },
            { t: "当别人直接对你说话时，你是否经常显得心不在焉？" },
            { t: "你是否经常无法按指示完成任务，导致工作/家务半途而废？" },
            { t: "你是否经常难以组织和安排自己的任务和活动？" },
            { t: "你是否经常回避、厌恶或不情愿去做需要持续动脑的任务？" },
            { t: "你是否经常丢失任务或活动所需的物品（手机、钥匙）？" },
            { t: "你是否经常容易被外界刺激干扰而分心？" },
            { t: "你是否在日常活动中经常忘记缴费、约会等琐事？" },
            { t: "你是否发现自己很难从一个活动切换到另一个活动？" },
            { t: "你是否经常手脚动个不停，或在座位上扭动？" },
            { t: "在被要求坐好的场合，你是否经常擅自离开座位？" },
            { t: "你是否经常在不适当的场合感到坐立不安或想跑动？" },
            { t: "你是否经常难以安静地参加休闲活动？" },
            { t: "你是否经常表现得像“被马达驱动”一样忙个不停？" },
            { t: "你是否经常说话过多，有时停不下来？" },
            { t: "在问题还没问完时，你是否经常抢着回答？" },
            { t: "在需要排队轮候时，你是否经常感到极度不耐烦？" },
            { t: "你是否经常打断他人的对话或强行加入他人活动？" },
            { t: "你是否经常在还没想清楚后果前就采取行动？" },
            { t: "你是否经常感到情绪波动剧烈，且难以控制？" },
            { t: "你是否发现自己很容易因为一点小挫折而感到极度沮丧？" },
            { t: "你是否经常感到一种内在的、无法解释的焦虑感？" },
            { t: "你是否经常拖延那些看起来并不难处理的决定？" },
            { t: "你是否发现自己很难维持长期的兴趣或习惯？" },
            { t: "你是否经常在对话中忘记自己刚才想说什么？" },
            { t: "你是否经常在寻找物品上花费大量时间？" },
            { t: "你是否感觉自己的睡眠模式非常混乱？" },
            { t: "你是否经常被家人或朋友抱怨“做事没计划”？" },
            { t: "你是否经常在截止日期临近时才爆发出惊人的动力？" },
            { t: "你是否经常感到自己的大脑像有很多个频道在同时播放？" },
            { t: "你是否发现自己很难处理多线并行的复杂任务？" },
            { t: "你是否经常在阅读长篇文章时发现自己一直在走神？" },
            { t: "你是否经常因为过度投入某件有趣的事而忘记时间？" },
            { t: "你是否经常感到自己的情绪很容易受周围环境影响？" },
            { t: "你是否经常感到自尊心受挫，觉得自己不如同龄人有条理？" },
            { t: "你是否经常因为忘记重要的承诺而感到愧疚？" },
            { t: "你是否经常通过购买新东西来获得短暂的兴奋感？" },
            { t: "你是否经常在安静的环境中感到特别难受？" },
            { t: "你是否经常觉得生活像一团乱麻，不知从何整理？" }
        ];

        const optionLabels = ["从未如此", "很少发生", "有时发生", "经常发生", "总是发生"];
        let currentIdx = 0;
        let totalScore = 0;

        function startQuiz() {
            document.getElementById('start-page').style.display = 'none';
            document.getElementById('quiz-page').classList.add('fade-in');
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentIdx];
            document.getElementById('q-text').innerText = q.t;
            document.getElementById('q-label').innerText = `第 ${currentIdx + 1} 题`;
            document.getElementById('bar-fill').style.width = `${((currentIdx + 1) / 40) * 100}%`;

            const box = document.getElementById('options-box');
            box.innerHTML = '';
            optionLabels.forEach((label, score) => {
                const div = document.createElement('div');
                div.className = 'option-card';
                div.innerHTML = `<span>${label}</span><span class="score-hint">+${score}分</span>`;
                div.onclick = () => { totalScore += score; if(currentIdx < 39){ currentIdx++; showQuestion(); } else { renderResult(); } };
                box.appendChild(div);
            });
        }

        function renderResult() {
            document.getElementById('quiz-page').style.display = 'none';
            document.getElementById('result-page').classList.add('fade-in');
            document.getElementById('total-score').innerText = totalScore;

            let tag = ""; let advice = "";
            if (totalScore <= 50) {
                tag = "低度倾向 · 思维稳健";
                advice = "你的思维极具条理性。这种‘定力’是中国式亲密关系中非常宝贵的特质。";
            } else if (totalScore <= 100) {
                tag = "中度倾向 · 能量分散";
                advice = "你的思维活跃但有时会陷入‘精力内耗’。建议使用我们手册中的管理工具。";
            } else {
                tag = "高度倾向 · 建议评估";
                advice = "你的大脑里可能正进行着一场‘风暴’。猪八吉建议你寻求专业评估并加入社群。";
            }
            document.getElementById('result-tag').innerText = tag;
            document.getElementById('baji-advice').innerText = advice;
        }
    </script>
</body>
</html>
