<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爱的语言测试 | 专业版</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            text-align: center;
        }
        h1 {
            color: #6a0dad;
            margin-bottom: 15px;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .start-btn {
            display: inline-block;
            background: linear-gradient(135deg, #8a2be2, #6a0dad);
            color: white;
            padding: 15px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(106, 13, 173, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💝 爱的语言测试</h1>
        <p>通过12个精心设计的问题，发现你的主要爱语类型</p>
        <p>了解如何更好地表达爱，改善亲密关系</p>
        <a href="test.html" class="start-btn">开始测试 →</a>
    </div>
</body>
</html>
