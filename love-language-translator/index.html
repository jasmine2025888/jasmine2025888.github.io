<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猪八吉家传·爱的方言翻译器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== 重置与基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

       :root {
    --primary-pink: #7C3AED;      /* 紫色 */
    --secondary-orange: #F59E0B;  /* 琥珀色 */
    --accent-mint: #10B981;       /* 翡翠绿 */
    --dark-purple: #4C1D95;       /* 深紫色 */
    --light-bg: #FAF5FF;          /* 浅紫色背景 */
    --border-pink: #DDD6FE;       /* 浅紫色边框 */
    --text-dark: #1F2937;         /* 深灰文字 */
    --text-light: #6B7280;        /* 中灰文字 */
    --shadow-light: rgba(124, 58, 237, 0.15);
    --shadow-medium: rgba(124, 58, 237, 0.25);
}

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #FFF0F5 0%, #FFFAFD 100%);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        /* ===== 主容器 ===== */
        .test-container {
            display: flex;
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 25px;
            box-shadow: 0 15px 50px var(--shadow-light);
            overflow: hidden;
            min-height: 85vh;
            transition: all 0.3s ease;
        }

        /* ===== 左侧图片区 (1/3) ===== */
        .pig-sidebar {
            flex: 1;
            background: linear-gradient(to bottom, #FFF0F5, #FFFAFA);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 25px;
            position: relative;
            border-right: 3px dashed var(--border-pink);
            min-width: 300px;
        }

        .pig-sidebar::after {
            content: '';
            position: absolute;
            top: 0;
            right: -3px;
            height: 100%;
            width: 3px;
            background: linear-gradient(to bottom, transparent, var(--primary-pink), transparent);
        }

        .pig-image-container {
            width: 100%;
            max-width: 350px;
            aspect-ratio: 3/4;
            background: white;
            border-radius: 20px;
            border: 5px solid var(--primary-pink);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(255, 123, 172, 0.2);
            transition: transform 0.5s ease, box-shadow 0.5s ease;
        }

        .pig-image-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(255, 123, 172, 0.3);
        }

        .pig-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .pig-speech-container {
            width: 100%;
            max-width: 350px;
            margin-top: 15px;
        }

        .pig-speech-bubble {
            background: white;
            padding: 18px 22px;
            border-radius: 20px;
            border: 3px solid var(--primary-pink);
            position: relative;
            font-size: 16px;
            color: var(--dark-purple);
            line-height: 1.5;
            box-shadow: 0 5px 15px rgba(255, 123, 172, 0.1);
        }

        .pig-speech-bubble::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 12px solid var(--primary-pink);
        }

        .pig-speech-bubble::after {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 10px solid white;
        }

        .love-type-indicator {
            margin-top: 25px;
            text-align: center;
            width: 100%;
            max-width: 350px;
        }

        .indicator-label {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .indicator-value {
            font-size: 22px;
            font-weight: 700;
            padding: 12px 20px;
            background: linear-gradient(45deg, var(--light-bg), white);
            border-radius: 15px;
            border: 2px solid var(--border-pink);
            transition: all 0.3s ease;
        }

        /* ===== 右侧题目区 (2/3) ===== */
        .question-sidebar {
            flex: 2;
            padding: 40px 45px;
            display: flex;
            flex-direction: column;
            min-width: 500px;
        }

        /* 进度条 */
        .progress-container {
            width: 100%;
            margin-bottom: 35px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 15px;
            color: var(--dark-purple);
            font-weight: 500;
        }

        .progress-bar {
            height: 12px;
            background: #F0F0F0;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(to right, var(--primary-pink), var(--secondary-orange));
            border-radius: 6px;
            transition: width 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* 题目内容 */
        .question-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .question-number {
            font-size: 16px;
            color: var(--primary-pink);
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .question-number i {
            margin-right: 8px;
        }

        .question-text {
            font-size: 26px;
            line-height: 1.4;
            color: var(--dark-purple);
            font-weight: 600;
            margin-bottom: 15px;
        }

        .question-tip {
            font-size: 15px;
            color: var(--text-light);
            font-style: italic;
            margin-bottom: 35px;
            padding-left: 5px;
        }

        /* 选项容器 */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 30px;
        }

        .option {
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-content {
            display: flex;
            align-items: center;
            padding: 20px 25px;
            background: white;
            border: 3px solid #F0F0F0;
            border-radius: 18px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .option-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(to right, var(--primary-pink), var(--secondary-orange));
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .option-icon {
            width: 60px;
            height: 60px;
            flex-shrink: 0;
            margin-right: 20px;
            background: var(--light-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            border: 3px solid var(--border-pink);
            transition: all 0.3s ease;
        }

        .option-text {
            flex: 1;
            font-size: 17px;
            line-height: 1.4;
            font-weight: 500;
        }

        .option-desc {
            font-size: 13px;
            color: var(--text-light);
            margin-top: 5px;
        }

        .option-check {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            background: var(--primary-pink);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
            opacity: 0;
            transition: all 0.3s ease;
        }

        /* 选项交互效果 */
        .option:hover .option-content {
            border-color: var(--primary-pink);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px var(--shadow-medium);
        }

        .option:hover .option-icon {
            transform: scale(1.05);
            background: var(--primary-pink);
            color: white;
            border-color: var(--primary-pink);
        }

        .option:hover .option-content::before {
            transform: scaleX(1);
        }

        .option.selected .option-content {
            border-color: var(--primary-pink);
            background: linear-gradient(to right, #FFF5F9, white);
            box-shadow: 0 10px 25px var(--shadow-medium);
        }

        .option.selected .option-content::before {
            transform: scaleX(1);
        }

        .option.selected .option-icon {
            background: var(--primary-pink);
            color: white;
            border-color: var(--primary-pink);
            transform: scale(1.1);
        }

        .option.selected .option-check {
            opacity: 1;
            transform: translateY(-50%) scale(1);
        }

        /* 点击动效 */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .option.pulse .option-content {
            animation: pulse 0.4s ease;
        }

        /* 涟漪效果 */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 123, 172, 0.3);
            transform: scale(0);
            animation: ripple-animation 0.6s linear;
        }

        @keyframes ripple-animation {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* 导航按钮 */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 20px;
        }

        .nav-button {
            padding: 16px 30px;
            border: none;
            border-radius: 15px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 140px;
        }

        .btn-prev {
            background: white;
            color: var(--text-dark);
            border: 3px solid var(--border-pink);
        }

        .btn-prev:hover:not(:disabled) {
            background: var(--light-bg);
            border-color: var(--primary-pink);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px var(--shadow-light);
        }

        .btn-prev:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-next {
            background: linear-gradient(to right, var(--primary-pink), var(--secondary-orange));
            color: white;
            flex: 1;
            max-width: 200px;
        }

        .btn-next:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 123, 172, 0.4);
        }

        .btn-next:disabled {
            background: #CCCCCC;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ===== 响应式设计 ===== */
        @media (max-width: 1024px) {
            .test-container {
                flex-direction: column;
                max-width: 700px;
            }
            
            .pig-sidebar {
                flex: none;
                height: auto;
                padding: 25px;
                border-right: none;
                border-bottom: 3px dashed var(--border-pink);
            }
            
            .question-sidebar {
                min-width: auto;
                padding: 30px;
            }
            
            .question-text {
                font-size: 22px;
            }
            
            .nav-buttons {
                flex-wrap: wrap;
            }
            
            .btn-prev, .btn-next {
                flex: 1;
                min-width: 120px;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            
            .test-container {
                border-radius: 20px;
            }
            
            .pig-sidebar, .question-sidebar {
                padding: 20px;
            }
            
            .pig-image-container {
                max-width: 280px;
            }
            
            .question-text {
                font-size: 20px;
            }
            
            .option-content {
                padding: 15px 18px;
                flex-direction: column;
                align-items: flex-start;
            }
            
            .option-icon {
                width: 50px;
                height: 50px;
                font-size: 22px;
                margin-right: 0;
                margin-bottom: 12px;
            }
            
            .option-check {
                position: relative;
                right: auto;
                top: auto;
                transform: none;
                margin-top: 10px;
                align-self: flex-end;
            }
            
            .nav-button {
                padding: 14px 20px;
                font-size: 16px;
                min-width: 100px;
            }
        }

        /* ===== 音效控制 ===== */
        .sound-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
        }

        .sound-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: white;
            border: 2px solid var(--primary-pink);
            color: var(--primary-pink);
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .sound-btn:hover {
            background: var(--primary-pink);
            color: white;
            transform: scale(1.1);
        }

        /* ===== 加载状态 ===== */
        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.9);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .loading.active {
            display: flex;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid var(--border-pink);
            border-top-color: var(--primary-pink);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 18px;
            color: var(--dark-purple);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- 主测试容器 -->
    <div class="test-container">
        <!-- 左侧猪八吉区域 -->
        <div class="pig-sidebar">
            <div class="pig-image-container">
                <img src="https://images.unsplash.com/photo-1563482776068-4dac10f9373d?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" 
                     alt="猪八吉漫画场景" class="pig-image" id="pigImage">
            </div>
            
            <div class="pig-speech-container">
                <div class="pig-speech-bubble" id="pigSpeech">
                    欢迎！媳妇让俺陪你完成这个测试～
                </div>
            </div>
            
            <div class="love-type-indicator">
                <div class="indicator-label">当前爱语倾向</div>
                <div class="indicator-value" id="currentLoveType">
                    <i class="fas fa-heartbeat"></i> 检测中...
                </div>
            </div>
        </div>
        
        <!-- 右侧题目区域 -->
        <div class="question-sidebar">
            <!-- 进度条 -->
            <div class="progress-container">
                <div class="progress-label">
                    <span><i class="fas fa-language"></i> 爱的方言翻译器 · 完整版</span>
                    <span id="progressText">第 1/12 题</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 8.33%;"></div>
                </div>
            </div>
            
            <!-- 题目内容 -->
            <div class="question-content">
                <div class="question-number">
                    <i class="far fa-question-circle"></i> 问题 #<span id="questionNum">1</span>
                </div>
                <div class="question-text" id="questionText">
                    <!-- 题目会动态填充 -->
                </div>
                <div class="question-tip" id="questionTip">
                    <!-- 提示会动态填充 -->
                </div>
                
                <!-- 选项容器 -->
                <div class="options-container" id="optionsContainer">
                    <!-- 选项会通过JS动态生成 -->
                </div>
            </div>
            
            <!-- 导航按钮 -->
            <div class="nav-buttons">
                <button class="nav-button btn-prev" id="prevBtn" disabled>
                    <i class="fas fa-arrow-left"></i> 上一题
                </button>
                <button class="nav-button btn-next" id="nextBtn" disabled>
                    下一题 <i class="fas fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>
    
    <!-- 音效控制 -->
    <div class="sound-control">
        <button class="sound-btn" id="soundToggle">
            <i class="fas fa-volume-up"></i>
        </button>
    </div>
    
    <!-- 加载状态 -->
    <div class="loading" id="loadingScreen">
        <div class="spinner"></div>
        <div class="loading-text">正在生成你的专属报告...</div>
    </div>
    
    <!-- 音效元素 -->
    <audio id="clickSound" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-select-click-1109.mp3" type="audio/mpeg">
    </audio>
    <audio id="pageSound" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-page-turn-swipe-1104.mp3" type="audio/mpeg">
    </audio>
    <audio id="successSound" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-achievement-bell-600.mp3" type="audio/mpeg">
    </audio>

    <script>
        // ===== 12道题目完整数据 =====
        const questions = [
            {
                id: 1,
                text: "媳妇过生日，猪八吉怎么做你最暖心？",
                tip: "想象你是媳妇，选择最让你开心的方式",

            {

                    { text: "进门先抱抱你，亲一下额头", type: "touch", icon: "👫", desc: "身体的接触" }

            {

                pigImage: "images/scene_03.jpg"
            },
            {
                id: 4,
                text: "日常生活中，你最喜欢怎样表达爱意？",
                tip: "选择你最常用的方式",
                options: [
                    { text: "经常说'爱你''想你'", type: "words", icon: "💬", desc: "肯定的言辞" },
                    { text: "帮TA挤牙膏、倒水等小事", type: "acts", icon: "🤗", desc: "服务的行动" },

                    { text: "每天抽时间专门聊天", type: "time", icon: "🕰️", desc: "精心的时刻" },
                    { text: "走路牵手，坐车靠肩", type: "touch", icon: "👫", desc: "身体的接触" }
                ],
                pigSpeech: "媳妇说俺不懂浪漫，俺觉得爱要做出来，你说呢？",
                pigImage: "images/scene_04.jpg"

                options: [

        // ===== 爱语类型定义 =====

            words: { 
                name: "💬 言值派", 
                color: "#FF7BAC", 
                emoji: "💬",
                desc: "你通过语言表达爱，也渴望听到对方的肯定。一句'我爱你'、'你真棒'能让你开心一整天。"
            },
            acts: { 
                name: "🤗 行动派", 
                color: "#FFB347", 
                emoji: "🤗",
                desc: "你相信爱是做出来的，不是说出来。对方为你做的每件小事，都是爱的证明。"
            },
            gifts: { 
                name: "🎁 仪式派", 
                color: "#6EC5B8", 
                emoji: "🎁",
                desc: "礼物对你很重要，它代表心意和重视。不需要贵重，但需要用心。"
            },
            time: { 
                name: "🕰️ 陪伴派", 
                color: "#9D7AD2", 
                emoji: "🕰️",
                desc: "对你来说，最奢侈的礼物是TA的专注时间。人在心在，比什么都重要。"
            },
            touch: { 
                name: "👫 接触派", 
                color: "#FF85A2", 
                emoji: "👫",
                desc: "你喜欢拥抱、牵手、依偎，身体接触让你感受到最直接的爱意。"
            }
        };

        // ===== 全局状态 =====
        let currentQuestionIndex = 0;
        let userAnswers = new Array(questions.length).fill(null);
        let selectedOption = null;
        let soundEnabled = true;
        
        // ===== DOM元素 =====
        const questionNumEl = document.getElementById('questionNum');
        const questionTextEl = document.getElementById('questionText');
        const questionTipEl = document.getElementById('questionTip');
        const optionsContainerEl = document.getElementById('optionsContainer');
        const progressTextEl = document.getElementById('progressText');
        const progressFillEl = document.getElementById('progressFill');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pigSpeechEl = document.getElementById('pigSpeech');
        const pigImageEl = document.getElementById('pigImage');
        const currentLoveTypeEl = document.getElementById('currentLoveType');
        const loadingScreen = document.getElementById('loadingScreen');
        const soundToggle = document.getElementById('soundToggle');
        
        // 音效元素
        const clickSound = document.getElementById('clickSound');
        const pageSound = document.getElementById('pageSound');
        const successSound = document.getElementById('successSound');

        // ===== 初始化函数 =====
        function init() {
            // 加载第一题
            loadQuestion(currentQuestionIndex);
            updateProgress();
            updateLoveTypeIndicator();
            
            // 绑定事件
            prevBtn.addEventListener('click', goToPrevious);
            nextBtn.addEventListener('click', goToNext);
            soundToggle.addEventListener('click', toggleSound);
            
            // 键盘支持
            document.addEventListener('keydown', handleKeydown);
            
            // 初始化音效状态
            updateSoundButton();
            
            console.log("猪八吉测试系统初始化完成！题目数量：", questions.length);
        }

        // ===== 加载题目 =====
        function loadQuestion(index) {
            const question = questions[index];
            
            // 更新题目信息
            questionNumEl.textContent = index + 1;
            questionTextEl.textContent = question.text;
            questionTipEl.textContent = question.tip;
            
            // 更新猪八吉区域
            pigSpeechEl.textContent = question.pigSpeech;
            // 图片暂时使用占位图，后期替换
            // pigImageEl.src = question.pigImage;
            
            // 清空并生成选项
            optionsContainerEl.innerHTML = '';
            selectedOption = null;
            
            question.options.forEach((option, optionIndex) => {
                const isSelected = userAnswers[index] === optionIndex;
                const typeInfo = loveTypes[option.type];
                
                const optionEl = document.createElement('div');
                optionEl.className = `option ${isSelected ? 'selected' : ''}`;
                optionEl.dataset.index = optionIndex;
                optionEl.dataset.type = option.type;
                
                optionEl.innerHTML = `
                    <div class="option-content">
                        <div class="option-icon" style="border-color: ${typeInfo.color}">
                            ${option.icon}
                        </div>
                        <div class="option-text">
                            ${option.text}
                            <div class="option-desc">${option.desc}</div>
                        </div>
                        ${isSelected ? '<div class="option-check">✓</div>' : ''}
                    </div>
                `;
                
                optionEl.addEventListener('click', () => selectOption(optionIndex, option.type));
                optionsContainerEl.appendChild(optionEl);
                
                if (isSelected) selectedOption = optionIndex;
            });
            
            // 更新按钮状态
            updateButtons();
        }

        // ===== 选择选项 =====
        function selectOption(index, type) {
            // 播放点击音效
            if (soundEnabled) playSound(clickSound);
            
            // 动画效果
            const optionEl = optionsContainerEl.children[index];
            optionEl.classList.add('selected');
            optionEl.classList.add('pulse');
            
            // 移除其他选项的选中状态
            Array.from(optionsContainerEl.children).forEach((el, i) => {
                if (i !== index && el.classList.contains('selected')) {
                    el.classList.remove('selected');
                    const check = el.querySelector('.option-check');
                    if (check) check.remove();
                }
            });
            
            // 添加选中标记
            if (!optionEl.querySelector('.option-check')) {
                const check = document.createElement('div');
                check.className = 'option-check';
                check.textContent = '✓';
                optionEl.querySelector('.option-content').appendChild(check);
            }
            
            // 创建涟漪效果
            createRippleEffect(optionEl.querySelector('.option-content'), loveTypes[type].color);
            
            // 保存答案
            userAnswers[currentQuestionIndex] = index;
            selectedOption = index;
            
            // 更新爱语指示器
            updateLoveTypeIndicator();
            
            // 更新按钮
            updateButtons();
            
            // 移除动画类
            setTimeout(() => optionEl.classList.remove('pulse'), 400);
        }

        // ===== 创建涟漪效果 =====
        function createRippleEffect(element, color) {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.background = color + '40';
            
            const rect = element.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const x = rect.width / 2;
            const y = rect.height / 2;
            
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = x - size / 2 + 'px';
            ripple.style.top = y - size / 2 + 'px';
            
            element.appendChild(ripple);
            
            setTimeout(() => {
                ripple.remove();
            }, 600);
        }

        // ===== 导航功能 =====
        function goToNext() {
            if (currentQuestionIndex < questions.length - 1) {
                // 播放翻页音效
                if (soundEnabled) playSound(pageSound);
                
                currentQuestionIndex++;
                loadQuestion(currentQuestionIndex);
                updateProgress();
            } else {
                // 最后一题，计算并跳转到结果页
                showLoadingAndRedirect();
            }
        }

        function goToPrevious() {
            if (currentQuestionIndex > 0) {
                // 播放翻页音效
                if (soundEnabled) playSound(pageSound);
                
                currentQuestionIndex--;
                loadQuestion(currentQuestionIndex);
                updateProgress();
            }
        }

        // ===== 显示加载并跳转 =====
        function showLoadingAndRedirect() {
            // 播放成功音效
            if (soundEnabled) playSound(successSound);
            
            // 显示加载动画
            loadingScreen.classList.add('active');
            
            // 计算结果
            const results = calculateResults();
            
            // 保存结果到localStorage
            localStorage.setItem('loveLanguageResults', JSON.stringify(results));
            
            // 2秒后跳转到结果页
            setTimeout(() => {
                window.location.href = 'result.html';
            }, 2000);
        }

        // ===== 计算结果 =====
        function calculateResults() {
            // 统计每种爱语的选择次数
            const counts = { words: 0, acts: 0, gifts: 0, time: 0, touch: 0 };
            
            userAnswers.forEach((answerIdx, qIdx) => {
                if (answerIdx !== null) {
                    const type = questions[qIdx].options[answerIdx].type;
                    counts[type]++;
                }
            });
            
            // 转换为数组并排序
            const results = Object.entries(counts).map(([type, count]) => ({
                type,
                name: loveTypes[type].name,
                color: loveTypes[type].color,
                emoji: loveTypes[type].emoji,
                desc: loveTypes[type].desc,
                count,
                percent: Math.round((count / questions.length) * 100)
            })).sort((a, b) => b.count - a.count);
            
            // 主要爱语类型
            const mainType = results[0];
            
            // 生成详细报告
            const report = {
                mainType: mainType.type,
                mainTypeName: mainType.name,
                mainTypeDesc: mainType.desc,
                results: results,
                userAnswers: userAnswers,
                testDate: new Date().toLocaleString('zh-CN'),
                totalQuestions: questions.length
            };
            
            return report;
        }

        // ===== 更新爱语指示器 =====
        function updateLoveTypeIndicator() {
            // 统计当前最频繁的爱语类型
            const counts = { words: 0, acts: 0, gifts: 0, time: 0, touch: 0 };
            
            userAnswers.forEach((answerIdx, qIdx) => {
                if (answerIdx !== null) {
                    const type = questions[qIdx].options[answerIdx].type;
                    counts[type]++;
                }
            });
            
            // 找出最高频的类型
            let maxType = null;
            let maxCount = 0;
            
            for (const [type, count] of Object.entries(counts)) {
                if (count > maxCount) {
                    maxCount = count;
                    maxType = type;
                }
            }
            
            // 更新显示
            if (maxType && maxCount > 0) {
                const typeInfo = loveTypes[maxType];
                currentLoveTypeEl.innerHTML = `
                    <span style="color: ${typeInfo.color}">
                        ${typeInfo.emoji} ${typeInfo.name}
                    </span>
                `;
                currentLoveTypeEl.style.borderColor = typeInfo.color;
            } else {
                currentLoveTypeEl.innerHTML = `<i class="fas fa-heartbeat"></i> 检测中...`;
                currentLoveTypeEl.style.borderColor = "var(--border-pink)";
            }
        }

        // ===== 更新进度 =====
        function updateProgress() {
            const percent = ((currentQuestionIndex + 1) / questions.length) * 100;
            progressFillEl.style.width = `${percent}%`;
            progressTextEl.textContent = `第 ${currentQuestionIndex + 1}/${questions.length} 题`;
            
            // 更新下一按钮文字
            nextBtn.innerHTML = currentQuestionIndex === questions.length - 1 ? 
                "查看结果 <i class='fas fa-chart-bar'></i>" : 
                "下一题 <i class='fas fa-arrow-right'></i>";
        }

        // ===== 更新按钮状态 =====
        function updateButtons() {
            prevBtn.disabled = currentQuestionIndex === 0;
            nextBtn.disabled = userAnswers[currentQuestionIndex] === null;
        }

        // ===== 音效控制 =====
        function toggleSound() {
            soundEnabled = !soundEnabled;
            updateSoundButton();
            
            // 保存音效设置到localStorage
            localStorage.setItem('loveLanguageSound', soundEnabled);
        }

        function updateSoundButton() {
            const icon = soundToggle.querySelector('i');
            if (soundEnabled) {
                icon.className = 'fas fa-volume-up';
                soundToggle.style.color = 'var(--primary-pink)';
                soundToggle.style.borderColor = 'var(--primary-pink)';
            } else {
                icon.className = 'fas fa-volume-mute';
                soundToggle.style.color = '#999';
                soundToggle.style.borderColor = '#999';
            }
            
            // 恢复之前保存的设置
            const savedSound = localStorage.getItem('loveLanguageSound');
            if (savedSound !== null) {
                soundEnabled = savedSound === 'true';
            }
        }

        // ===== 播放音效 =====
        function playSound(audioEl) {
            if (!soundEnabled) return;
            
            try {
                audioEl.currentTime = 0;
                audioEl.play().catch(e => {
                    console.log("音效播放被阻止:", e);
                });
            } catch (e) {
                console.log("音效播放错误:", e);
            }
        }

        // ===== 键盘支持 =====
        function handleKeydown(e) {
            switch(e.key) {
                case 'ArrowLeft':
                    if (!prevBtn.disabled) goToPrevious();
                    break;
                case 'ArrowRight':
                    if (!nextBtn.disabled) goToNext();
                    break;
                case '1': case '2': case '3': case '4': case '5':
                    const num = parseInt(e.key) - 1;
                    if (num < questions[currentQuestionIndex].options.length) {
                        const option = questions[currentQuestionIndex].options[num];
                        selectOption(num, option.type);
                    }
                    break;
                case 'Enter':
                    if (!nextBtn.disabled) goToNext();
                    break;
            }
        }

        // ===== 初始化应用 =====
        document.addEventListener('DOMContentLoaded', init);
    </script>
