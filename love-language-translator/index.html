<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猪八吉家传·爱的语言翻译器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-pink: #FF9494;        /* 温暖主粉色 */
            --secondary-pink: #FFC4C4;      /* 辅助粉色 */
            --accent-coral: #FF7A7A;        /* 珊瑚色点缀 */
            --accent-gold: #E8B054;         /* 金色点缀 */
            --warm-cream: #FFF9F0;          /* 温暖奶油色 */
            --cocoa-text: #5A4235;          /* 可可色文字 */
            --white: #FFFFFF;
            --border-warm: #FFD0C9;         /* 温暖边框色 */
            --shadow-light: rgba(93, 75, 64, 0.1);
            --shadow-medium: rgba(93, 75, 64, 0.15);
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        html {
            scroll-behavior: smooth;  /* 平滑滚动 */
        }

        body {
            font-family: 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #FFF9F0 0%, #FFEFDF 100%);
            color: var(--cocoa-text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== 测试容器 ===== */
        .test-container {
            min-height: 200vh;  /* 两屏高度 */
            position: relative;
        }

        /* ===== 第一屏：场景展示区 ===== */
        .scene-section {
            height: 100vh;  /* 占据整个视口高度 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 30px 15px 10px; /* 减少底部padding，让内容更紧凑 */
            background: linear-gradient(135deg, #FFF9F3, #FFF5ED);
            position: relative;
            overflow: hidden;
        }

        /* 装饰性背景元素 */
        .scene-section::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 148, 148, 0.1) 0%, transparent 70%);
            z-index: 0;
        }

        .scene-section::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(232, 176, 84, 0.08) 0%, transparent 70%);
            z-index: 0;
        }

        /* 场景图片容器 */
        .scene-image-container {
            width: 100%;
            max-width: 600px;
            height: 55vh;  /* 减少高度，减少空白 */
            border-radius: 25px;
            border: 10px solid var(--white);
            box-shadow: 0 20px 50px var(--shadow-medium);
            overflow: hidden;
            position: relative;
            z-index: 1;
            margin-bottom: 15px; /* 减少底部间距 */
            margin-top: 10px; /* 增加顶部间距，避免太靠上 */
            transition: all 0.4s ease;
        }

        .scene-image {
            width: 100%;
            height: 100%;
            object-fit: cover;  /* 保持比例，填满容器 */
            transition: transform 0.5s ease;
        }

        .scene-image:hover {
            transform: scale(1.02);
        }

        /* 猪八吉对话气泡 */
        .pig-speech-container {
            width: 100%;
            max-width: 550px;
            position: relative;
            z-index: 1;
            margin-bottom: 10px; /* 减少底部间距 */
        }

        .pig-speech-bubble {
            background: var(--cocoa-text);
            color: white;
            padding: 18px 22px;
            border-radius: 22px;
            font-size: 16px;
            line-height: 1.6;
            box-shadow: 0 10px 30px rgba(93, 75, 64, 0.2);
            position: relative;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .pig-speech-bubble::after {
            content: '';
            position: absolute;
            top: -10px;
            left: 50px;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 12px solid var(--cocoa-text);
        }

        /* 向下滑动继续 - 重要调整 */
        .scroll-hint {
            position: absolute;
            bottom: 5px; /* 向上移动，减少空白 */
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--accent-coral);
            font-size: 15px; /* 加大字号，原来13px，增加2号 */
            font-weight: 500; /* 增加字体粗细 */
            animation: bounce 2s infinite;
            z-index: 2;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0) translateX(-50%); }
            40% { transform: translateY(-10px) translateX(-50%); }
            60% { transform: translateY(-5px) translateX(-50%); }
        }

        .scroll-hint i {
            font-size: 26px; /* 加大图标大小 */
            margin-bottom: 3px;
        }

        /* ===== 第二屏：题目互动区 ===== */
        .question-section {
            min-height: 100vh;
            padding: 40px 20px;
            background: linear-gradient(to bottom, var(--white), #FFFCF8);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .question-section::before {
            content: '';
            position: absolute;
            top: -50px;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(to top, #FFFCF8, transparent);
            z-index: 1;
        }

        /* 进度条 */
        .progress-container {
            margin-bottom: 30px;
            position: relative;
            z-index: 2;
        }

        .progress-label {
            display: flex;
            flex-direction: column; /* 改为垂直布局 */
            gap: 5px; /* 两行之间的间距 */
            font-size: 14px;
            margin-bottom: 15px;
            color: var(--cocoa-text);
            font-weight: 500;
        }

        .progress-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-coral);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .progress-title i {
            font-size: 18px;
        }

        .progress-text {
            font-size: 14px;
            color: #8A7565;
            text-align: center;
        }

        .progress-bar {
            height: 10px;
            background: #F2E9E1;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(to right, var(--accent-coral), var(--accent-gold));
            border-radius: 10px;
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* 题目内容 */
        .question-header {
            margin-bottom: 35px;
            position: relative;
            z-index: 2;
        }

        .question-number {
            font-size: 14px;
            color: var(--accent-coral);
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .question-number i {
            font-size: 16px;
        }

        .question-text {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 15px;
            color: var(--cocoa-text);
        }

        .question-hint {
            font-size: 15px;
            color: #8A7565;
            font-style: italic;
        }

        /* 选项容器 */
        .options-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
            position: relative;
            z-index: 2;
        }

        .option-item {
            padding: 20px 25px;
            background: var(--white);
            border: 3px solid #F2E9E1;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 18px;
            position: relative;
            overflow: hidden;
        }

        .option-item:hover {
            border-color: var(--secondary-pink);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px var(--shadow-light);
        }

        .option-item.active {
            background: linear-gradient(135deg, rgba(255, 249, 249, 0.9), white);
            border-color: var(--accent-coral);
            box-shadow: 0 10px 30px rgba(255, 122, 122, 0.2);
            transform: translateY(-3px);
        }

        .option-item.active .option-icon {
            background: linear-gradient(135deg, var(--accent-coral), var(--accent-gold));
            color: white;
            transform: scale(1.1);
        }

        .option-item.active::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(to right, var(--accent-coral), var(--accent-gold));
        }

        .option-icon {
            font-size: 24px;
            background: #fdf2f2;
            width: 50px;
            height: 50px;
            min-width: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .option-text {
            font-size: 17px;
            line-height: 1.5;
            font-weight: 500;
            flex: 1;
        }

        /* 爱语倾向指示器 */
        .love-type-indicator {
            background: linear-gradient(135deg, #FFF9F0, #FFF5E1);
            padding: 20px;
            border-radius: 16px;
            border: 3px solid var(--border-warm);
            margin-top: 25px;
            text-align: center;
            position: relative;
            z-index: 2;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
            min-width: 0; /* 添加最小宽度限制 */
        }

        .indicator-label {
            font-size: 13px;
            color: #8A7565;
            margin-bottom: 8px;
        }

        .indicator-value {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent-coral);
            white-space: nowrap; /* 防止文字换行 */
            overflow: hidden; /* 隐藏溢出内容 */
            text-overflow: ellipsis; /* 超出时显示省略号 */
            padding: 0 5px; /* 添加内边距 */
        }

        /* 音效开关 */
        .sound-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--white);
            border: 2px solid var(--border-warm);
            color: var(--accent-coral);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .sound-toggle:hover {
            transform: scale(1.1);
            border-color: var(--accent-coral);
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .scene-image-container {
                height: 50vh;  /* 手机端图片高度 */
                max-width: 90%;
                border-width: 8px;
                margin-bottom: 12px;
            }
            
            .pig-speech-bubble {
                padding: 16px 20px;
                font-size: 15px;
                max-width: 90%;
                margin-bottom: 8px;
            }
            
            .scroll-hint {
                bottom: 3px; /* 手机端也向上移动 */
                font-size: 14px; /* 手机端也加大 */
            }
            
            .scroll-hint i {
                font-size: 24px;
            }
            
            .progress-title {
                font-size: 15px;
            }
            
            .progress-text {
                font-size: 13px;
            }
            
            .question-text {
                font-size: 22px;
            }
            
            .option-item {
                padding: 18px 22px;
            }
            
            .option-icon {
                width: 46px;
                height: 46px;
                min-width: 46px;
                font-size: 22px;
            }
            
            .option-text {
                font-size: 16px;
            }
            
            /* 手机端爱语指示器调整 */
            .love-type-indicator {
                padding: 18px 15px;
            }
            
            .indicator-value {
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .scene-section {
                padding: 20px 15px 5px; /* 进一步减少底部padding */
            }
            
            .scene-image-container {
                height: 45vh;
                border-width: 6px;
                border-radius: 20px;
                margin-top: 5px;
                margin-bottom: 10px;
            }
            
            .pig-speech-bubble {
                padding: 14px 18px;
                font-size: 14px;
                margin-bottom: 5px;
            }
            
            .scroll-hint {
                bottom: 2px;
                font-size: 13px;
            }
            
            .scroll-hint i {
                font-size: 22px;
            }
            
            .question-text {
                font-size: 20px;
            }
            
            .option-item {
                padding: 16px 20px;
                gap: 15px;
            }
            
            .option-icon {
                width: 42px;
                height: 42px;
                min-width: 42px;
                font-size: 20px;
            }
            
            .option-text {
                font-size: 15px;
            }
            
            /* 小屏幕爱语指示器进一步调整 */
            .love-type-indicator {
                padding: 16px 12px;
                margin-top: 20px;
            }
            
            .indicator-value {
                font-size: 15px;
            }
            
            .sound-toggle {
                width: 45px;
                height: 45px;
                font-size: 20px;
                bottom: 15px;
                right: 15px;
            }
        }

        /* 非常小的手机 */
        @media (max-width: 360px) {
            .scene-section {
                padding: 15px 12px 3px;
            }
            
            .scene-image-container {
                height: 40vh;
                margin-top: 5px;
                margin-bottom: 8px;
            }
            
            .scroll-hint {
                bottom: 1px;
                font-size: 12px;
            }
            
            .scroll-hint i {
                font-size: 20px;
            }
            
            .question-text {
                font-size: 19px;
            }
            
            .option-text {
                font-size: 14px;
            }
            
            .love-type-indicator {
                padding: 14px 10px;
            }
            
            .indicator-value {
                font-size: 14px;
            }
        }

        /* 滚动条美化 */
        body::-webkit-scrollbar {
            width: 8px;
        }

        body::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        body::-webkit-scrollbar-thumb {
            background: var(--secondary-pink);
            border-radius: 4px;
        }

        body::-webkit-scrollbar-thumb:hover {
            background: var(--primary-pink);
        }
    </style>
</head>
<body>

<div class="test-container">
    <!-- 第一屏：场景展示区 -->
    <section class="scene-section" id="sceneSection">
        <div class="scene-image-container">
            <img src="images/scene_01.jpg" alt="猪八吉与媳妇的温馨场景" class="scene-image" id="sceneImage">
        </div>
        
        <div class="pig-speech-container">
            <div class="pig-speech-bubble" id="pigSpeech">媳妇让俺陪你完成这个爱的测试～</div>
        </div>
        
        <div class="scroll-hint">
            <i class="fas fa-chevron-down"></i>
            <span>向下滑动继续</span>
        </div>
    </section>
    
    <!-- 第二屏：题目互动区 -->
    <section class="question-section" id="questionSection">
        <div class="progress-container">
            <div class="progress-label">
                <div class="progress-title">
                    <i class="fas fa-heart"></i> 猪八吉家传、爱的语言翻译器
                </div>
                <div class="progress-text" id="progressText">第 1 题 / 共 12 题</div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 8.33%;"></div>
            </div>
        </div>

        <div class="question-header">
            <div class="question-number">
                <i class="far fa-question-circle"></i> 问题 #<span id="questionNum">1</span>
            </div>
            <div class="question-text" id="questionText">正在加载题目...</div>
            <div class="question-hint">选择最能触动你的选项</div>
        </div>

        <div class="options-container" id="optionsContainer">
            <!-- 选项将通过JavaScript动态生成 -->
        </div>
        
        <div class="love-type-indicator" id="loveTypeIndicator">
            <div class="indicator-label">当前爱语倾向</div>
            <div class="indicator-value">正在检测中...</div>
        </div>
    </section>
</div>

<!-- 音效开关 -->
<div class="sound-toggle" id="soundToggle" title="音效开关">
    <i class="fas fa-volume-up"></i>
</div>

<script>
    // 题目数据 - 根据图片中选项显示的文字调整
    const questions = [
        { 
            text: "媳妇过生日，猪八吉怎么做你最暖心？", 
            options: [
                { text: "写张小卡片说'媳妇辛苦了，俺永远爱你'", type: "words", icon: "💬" },
                { text: "承包一个月家务，让媳妇当皇后", type: "acts", icon: "🤗" },
                { text: "精心准备一份礼物，哪怕不贵重", type: "gifts", icon: "🎁" },
                { text: "请一天假，专心陪媳妇逛街聊天", type: "time", icon: "🕰️" },
                { text: "给媳妇一个大大拥抱，说'有你在真好'", type: "touch", icon: "👫" }
            ], 
            speech: "媳妇生日！俺得好好表现～你希望伴侣怎么为你庆祝？" 
        },
        { 
            text: "猪八吉加班晚归，你希望他？", 
            options: [
                { text: "发条消息：'媳妇，俺想你，马上回'", type: "words", icon: "💬" },
                { text: "带宵夜回来，热好了端给你", type: "acts", icon: "🤗" },
                { text: "顺手带枝花或小零食", type: "gifts", icon: "🎁" },
                { text: "回家后放下手机，认真听你说话", type: "time", icon: "🕰️" },
                { text: "进门先抱抱你，亲一下额头", type: "touch", icon: "👫" }
            ], 
            speech: "加班晚了，媳妇在家等俺...怎么做才能让她不生气？" 
        },
        { 
            text: "你们吵架后，哪种和好方式最有效？", 
            options: [
                { text: "对方真诚道歉：'是俺不对'", type: "words", icon: "💬" },
                { text: "默默帮你把活儿干了", type: "acts", icon: "🤗" },
                { text: "送你个小礼物示好", type: "gifts", icon: "🎁" },
                { text: "拉你坐下，耐心沟通", type: "time", icon: "🕰️" },
                { text: "一把抱住你，不松手", type: "touch", icon: "👫" }
            ], 
            speech: "吵架了，媳妇不理俺，咋办？哪种方式最能让她消气？" 
        },
        { 
            text: "日常生活中，你最喜欢怎样表达爱意？", 
            options: [
                { text: "经常说'爱你''想你'", type: "words", icon: "💬" },
                { text: "帮TA挤牙膏、倒水等小事", type: "acts", icon: "🤗" },
                { text: "看到适合TA的东西就买下来", type: "gifts", icon: "🎁" },
                { text: "每天抽时间专门聊天", type: "time", icon: "🕰️" },
                { text: "走路牵手，坐车靠肩", type: "touch", icon: "👫" }
            ], 
            speech: "媳妇说俺不懂浪漫，俺觉得爱要做出来，你说呢？" 
        },
        { 
            text: "心情低落时，最希望TA怎么做？", 
            options: [
                { text: "鼓励你：'你是最棒的'", type: "words", icon: "💬" },
                { text: "为你泡杯茶，做点实际的", type: "acts", icon: "🤗" },
                { text: "送个小玩偶或零食", type: "gifts", icon: "🎁" },
                { text: "陪你散步，安静倾听", type: "time", icon: "🕰️" },
                { text: "搂着你，轻轻拍背", type: "touch", icon: "👫" }
            ], 
            speech: "媳妇心情不好，俺该怎么做？在线等，挺急的！" 
        },
        { 
            text: "纪念日（结婚/恋爱纪念），你更期待怎样庆祝？", 
            options: [
                { text: "写一封情书，当面念给你听", type: "words", icon: "💬" },
                { text: "策划一次家务大扫除，两人一起完成", type: "acts", icon: "🤗" },
                { text: "准备一份惊喜礼物", type: "gifts", icon: "🎁" },
                { text: "安排一次短途旅行，只有你们俩", type: "time", icon: "🕰️" },
                { text: "安排按摩、SPA等身体放松活动", type: "touch", icon: "👫" }
            ], 
            speech: "结婚纪念日到了，俺想给媳妇一个惊喜，你觉得哪种方式好？" 
        },
        { 
            text: "关于家务分工，你最看重什么？", 
            options: [
                { text: "TA常说'辛苦了''谢谢'", type: "words", icon: "💬" },
                { text: "TA主动分担，不用提醒", type: "acts", icon: "🤗" },
                { text: "买智能家电减轻负担", type: "gifts", icon: "🎁" },
                { text: "一起做家务，边做边聊天", type: "time", icon: "🕰️" },
                { text: "干活时给个鼓励的亲吻", type: "touch", icon: "👫" }
            ], 
            speech: "家务活这么多，媳妇嫌俺不干活，咋表现才好？" 
        },
        { 
            text: "异地时（出差/分居），什么最能让你感受到爱？", 
            options: [
                { text: "每天视频说'晚安'", type: "words", icon: "💬" },
                { text: "远程为你点外卖", type: "acts", icon: "🤗" },
                { text: "寄礼物包裹", type: "gifts", icon: "🎁" },
                { text: "长时间视频，一起看剧", type: "time", icon: "🕰️" },
                { text: "期待重逢时的拥抱", type: "touch", icon: "👫" }
            ], 
            speech: "出差在外，想媳妇了，怎么让她感受到俺的爱？" 
        },
        { 
            text: "当你工作压力大时，最需要TA？", 
            options: [
                { text: "说'你已经很优秀了'", type: "words", icon: "💬" },
                { text: "帮你处理生活琐事", type: "acts", icon: "🤗" },
                { text: "送减压小礼物（香薰、按摩仪等）", type: "gifts", icon: "🎁" },
                { text: "陪你吐槽，当情绪垃圾桶", type: "time", icon: "🕰️" },
                { text: "给你按摩肩膀", type: "touch", icon: "👫" }
            ], 
            speech: "媳妇工作压力大，俺想帮她分担，该怎么做？" 
        },
        { 
            text: "理想的周末时光，你希望怎样度过？", 
            options: [
                { text: "互相分享一周的感受", type: "words", icon: "💬" },
                { text: "一起做大餐，合作完成", type: "acts", icon: "🤗" },
                { text: "去逛商场/超市，买喜欢的东西", type: "gifts", icon: "🎁" },
                { text: "发展共同爱好（运动、手工等）", type: "time", icon: "🕰️" },
                { text: "窝在沙发上看电影，靠在一起", type: "touch", icon: "👫" }
            ], 
            speech: "周末了，和媳妇一起做点啥，才能让感情升温？" 
        },
        { 
            text: "关于教育孩子的方式，你们有分歧时，什么最能化解矛盾？", 
            options: [
                { text: "TA说：'你的出发点也是为孩子好'", type: "words", icon: "💬" },
                { text: "TA主动去辅导孩子作业", type: "acts", icon: "🤗" },
                { text: "给孩子买套新玩具/书，转移注意力", type: "gifts", icon: "🎁" },
                { text: "等孩子睡了，坐下来好好讨论教育理念", type: "time", icon: "🕰️" },
                { text: "拍拍你的肩说：'我们都是第一次当父母'", type: "touch", icon: "👫" }
            ], 
            speech: "俺想让孩子多玩，媳妇想让他多学习…吵架了，咋和好？" 
        },
        { 
            text: "关于家庭大额开支（买房/买车/投资），你最看重TA的什么表现？", 
            options: [
                { text: "TA说：'钱可以再赚，你的开心最重要'", type: "words", icon: "💬" },
                { text: "TA认真做预算表，列出各种方案", type: "acts", icon: "🤗" },
                { text: "TA准备一个小惊喜，让你觉得'钱花得值'", type: "gifts", icon: "🎁" },
                { text: "安排专门时间，一起研究各种选择", type: "time", icon: "🕰️" },
                { text: "握着你的手说：'不管怎么决定，我们一起承担'", type: "touch", icon: "👫" }
            ], 
            speech: "想换辆车，媳妇觉得该存钱，俺该咋办才能让她同意？" 
        }
    ];

    // 爱语类型定义 - 根据图片中的类型名称调整
    const loveTypes = {
        words: { name: "言语派", color: "#FF9494", emoji: "💬" },
        acts: { name: "行动派", color: "#FF7A7A", emoji: "🤗" },
        gifts: { name: "仪式派", color: "#E8B054", emoji: "🎁" },
        time: { name: "陪伴派", color: "#FFA07A", emoji: "🕰️" },
        touch: { name: "情感派", color: "#FF8A65", emoji: "👫" }
    };

    // 全局状态
    let currentIdx = 0;
    let scores = { words: 0, acts: 0, gifts: 0, time: 0, touch: 0 };
    let soundEnabled = true;

    // DOM元素
    const sceneImageEl = document.getElementById('sceneImage');
    const pigSpeechEl = document.getElementById('pigSpeech');
    const questionTextEl = document.getElementById('questionText');
    const questionNumEl = document.getElementById('questionNum');
    const progressTextEl = document.getElementById('progressText');
    const progressFillEl = document.getElementById('progressFill');
    const optionsContainerEl = document.getElementById('optionsContainer');
    const loveTypeIndicatorEl = document.getElementById('loveTypeIndicator');
    const soundToggleEl = document.getElementById('soundToggle');

    // 渲染题目
    function renderQuestion() {
        const q = questions[currentIdx];
        
        // 更新场景图片和对话
        sceneImageEl.src = `images/scene_${(currentIdx + 1).toString().padStart(2, '0')}.jpg`;
        pigSpeechEl.textContent = q.speech;
        
        // 更新题目信息
        questionTextEl.textContent = q.text;
        questionNumEl.textContent = currentIdx + 1;
        
        // 更新进度
        const progressPercent = ((currentIdx + 1) / questions.length * 100).toFixed(2);
        progressFillEl.style.width = `${progressPercent}%`;
        progressTextEl.textContent = `第 ${currentIdx + 1} 题 / 共 ${questions.length} 题`;
        
        // 清空并生成选项
        optionsContainerEl.innerHTML = '';
        
        q.options.forEach((option, index) => {
            const optionItem = document.createElement('div');
            optionItem.className = 'option-item';
            optionItem.dataset.index = index;
            optionItem.dataset.type = option.type;
            
            const typeColor = loveTypes[option.type].color;
            
            optionItem.innerHTML = `
                <div class="option-icon" style="color: ${typeColor}">${option.icon}</div>
                <div class="option-text">${option.text}</div>
            `;
            
            optionItem.addEventListener('click', () => selectOption(option.type, optionItem));
            optionsContainerEl.appendChild(optionItem);
        });
        
        // 更新爱语倾向指示器
        updateLoveTypeIndicator();
    }

    // 选择选项
    function selectOption(type, element) {
        // 播放音效
        if (soundEnabled) {
            const audio = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-select-click-1109.mp3');
            audio.volume = 0.3;
            audio.play().catch(e => console.log("音效播放被阻止"));
        }
        
        // 动画效果：选中状态
        element.classList.add('active');
        
        // 场景图片动画反馈
        sceneImageEl.style.transform = 'scale(1.05) rotate(1deg)';
        
        // 增加分数
        scores[type]++;
        
        // 创建点击涟漪效果
        createRippleEffect(element, loveTypes[type].color);
        
        // 延迟后进入下一题或完成测试
        setTimeout(() => {
            // 恢复场景图片状态
            sceneImageEl.style.transform = '';
            
            if (currentIdx < questions.length - 1) {
                // 还有下一题
                currentIdx++;
                renderQuestion();
                
                // 自动滚动到顶部（第一屏）
                document.getElementById('sceneSection').scrollIntoView({ 
                    behavior: 'smooth' 
                });
            } else {
                // 完成测试，跳转到结果页
                completeTest();
            }
        }, 800);
    }

    // 创建涟漪效果
    function createRippleEffect(element, color) {
        const ripple = document.createElement('span');
        const rect = element.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const x = rect.width / 2;
        const y = rect.height / 2;
        
        ripple.style.cssText = `
            position: absolute;
            border-radius: 50%;
            background: ${color}40;
            width: ${size}px;
            height: ${size}px;
            left: ${x - size/2}px;
            top: ${y - size/2}px;
            transform: scale(0);
            animation: ripple 0.6s linear;
            z-index: 1;
        `;
        
        element.style.position = 'relative';
        element.appendChild(ripple);
        
        // 添加CSS动画
        if (!document.getElementById('ripple-animation')) {
            const style = document.createElement('style');
            style.id = 'ripple-animation';
            style.textContent = `
                @keyframes ripple {
                    to { transform: scale(4); opacity: 0; }
                }
            `;
            document.head.appendChild(style);
        }
        
        setTimeout(() => ripple.remove(), 600);
    }

    // 更新爱语倾向指示器
    function updateLoveTypeIndicator() {
        // 计算当前最频繁的爱语类型
        const types = Object.entries(scores);
        if (types.every(([_, count]) => count === 0)) {
            loveTypeIndicatorEl.querySelector('.indicator-value').textContent = '正在检测中...';
            loveTypeIndicatorEl.style.borderColor = 'var(--border-warm)';
            return;
        }
        
        const sorted = types.sort((a, b) => b[1] - a[1]);
        const [mainType, count] = sorted[0];
        const typeInfo = loveTypes[mainType];
        
        const percent = Math.round((count / (currentIdx + 1)) * 100);
        loveTypeIndicatorEl.querySelector('.indicator-value').innerHTML = `
            <span style="color: ${typeInfo.color}">${typeInfo.emoji} ${typeInfo.name} (${percent}%)</span>
        `;
        
        // 更新指示器边框颜色
        loveTypeIndicatorEl.style.borderColor = typeInfo.color;
    }

    // 完成测试
    function completeTest() {
        // 计算最终结果
        const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
        const mainType = sorted[0][0];
        const mainCount = sorted[0][1];
        
        const result = {
            main: mainType,
            percent: Math.round(mainCount / questions.length * 100),
            all: scores,
            date: new Date().toLocaleString('zh-CN')
        };
        
        // 保存到localStorage
        localStorage.setItem('love_result', JSON.stringify(result));
        
        // 显示完成动画
        showCompletionAnimation();
        
        // 2秒后跳转到结果页
        setTimeout(() => {
            window.location.href = 'result.html';
        }, 2000);
    }

    // 显示完成动画
    function showCompletionAnimation() {
        const sceneSection = document.getElementById('sceneSection');
        const questionSection = document.getElementById('questionSection');
        
        // 场景图片放大庆祝
        sceneImageEl.style.transform = 'scale(1.1)';
        sceneImageEl.style.transition = 'transform 1s ease';
        
        // 显示庆祝文字
        pigSpeechEl.textContent = '测试完成啦！正在生成你的专属报告...';
        pigSpeechEl.style.backgroundColor = loveTypes[Object.entries(scores).sort((a, b) => b[1] - a[1])[0][0]].color;
        
        // 题目区域淡出
        questionSection.style.opacity = '0.5';
        questionSection.style.transition = 'opacity 1s ease';
    }

    // 音效控制
    function toggleSound() {
        soundEnabled = !soundEnabled;
        const icon = soundToggleEl.querySelector('i');
        
        if (soundEnabled) {
            icon.className = 'fas fa-volume-up';
            soundToggleEl.style.color = 'var(--accent-coral)';
            soundToggleEl.style.borderColor = 'var(--accent-coral)';
        } else {
            icon.className = 'fas fa-volume-mute';
            soundToggleEl.style.color = '#999';
            soundToggleEl.style.borderColor = '#999';
        }
        
        // 保存设置
        localStorage.setItem('love_test_sound', soundEnabled);
    }

    // 初始化
    function init() {
        // 渲染第一题
        renderQuestion();
        
        // 绑定音效切换
        soundToggleEl.addEventListener('click', toggleSound);
        
        // 恢复音效设置
        const savedSound = localStorage.getItem('love_test_sound');
        if (savedSound !== null) {
            soundEnabled = savedSound === 'true';
            toggleSound(); // 更新按钮状态
        }
        
        // 键盘支持
        document.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '5') {
                const index = parseInt(e.key) - 1;
                const options = optionsContainerEl.children;
                if (index < options.length) {
                    options[index].click();
                }
            }
        });
        
        console.log('猪八吉爱的语言翻译器已加载！');
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', init);
</script>
