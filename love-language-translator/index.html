<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猪八吉家传·爱的方言翻译器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-pink: #FF9494;
            --accent-coral: #FF7A7A;
            --accent-gold: #E8B054;
            --cocoa-text: #5A4235;
            --white: #FFFFFF;
            --border-warm: #FFD0C9;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            font-family: 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #FFF9F0 0%, #FFEFDF 100%);
            color: var(--cocoa-text);
            min-height: 100vh;
            padding: 0;
        }

        /* ===== 整体容器 ===== */
        .test-wrapper {
            max-width: 600px;
            margin: 0 auto;
            background: var(--white);
            min-height: 100vh;
            position: relative;
        }

        /* ===== 顶部栏 ===== */
        .top-bar {
            background: linear-gradient(to right, var(--accent-coral), var(--accent-gold));
            color: white;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .logo {
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* ===== 猪八吉区域 ===== */
        .pig-section {
            padding: 10px 15px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background: #FFFCF8;
            border-bottom: 2px solid var(--border-warm);
        }

        .pig-avatar {
            width: 55px;
            height: 55px;
            border-radius: 12px;
            border: 3px solid var(--white);
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            overflow: hidden;
            flex-shrink: 0;
        }

        .pig-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .pig-info {
            flex: 1;
        }

        .pig-speech {
            background: var(--cocoa-text);
            color: white;
            padding: 8px 10px;
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.3;
            margin-bottom: 5px;
            position: relative;
        }

        .pig-speech::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 15px;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid var(--cocoa-text);
        }

        .progress-container {
            margin-top: 5px;
        }

        .progress-label {
            font-size: 10px;
            color: #8A7565;
            margin-bottom: 3px;
        }

        .progress-bar {
            height: 4px;
            background: #F2E9E1;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(to right, var(--accent-coral), var(--accent-gold));
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        /* ===== 题目区域 ===== */
        .question-section {
            padding: 12px 15px;
            background: var(--white);
        }

        .question-header {
            margin-bottom: 8px;
        }

        .question-number {
            font-size: 11px;
            color: var(--accent-coral);
            font-weight: 600;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 5px;
        }

        .question-hint {
            font-size: 11px;
            color: #8A7565;
            font-style: italic;
        }

        /* ===== 选项区域 - 极度紧凑 ===== */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 6px; /* 最小间距 */
            margin-top: 10px;
        }

        .option-item {
            padding: 8px 10px;
            background: var(--white);
            border: 1.5px solid #F2E9E1;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 45px; /* 最小高度 */
        }

        .option-icon {
            font-size: 14px;
            background: #fdf2f2;
            width: 28px;
            height: 28px;
            min-width: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .option-text {
            font-size: 12.5px;
            line-height: 1.25;
            font-weight: 500;
            flex: 1;
        }

        .option-item.active {
            background: linear-gradient(135deg, rgba(255, 249, 249, 0.9), white);
            border-color: var(--accent-coral);
            box-shadow: 0 2px 6px rgba(255, 122, 122, 0.1);
        }

        .option-item.active .option-icon {
            background: linear-gradient(135deg, var(--accent-coral), var(--accent-gold));
            color: white;
        }

        /* ===== 底部状态栏 ===== */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #FFF9F0, #FFF5E1);
            padding: 8px 15px;
            border-top: 2px solid var(--border-warm);
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }

        .love-type-indicator {
            flex: 1;
        }

        .indicator-label {
            font-size: 10px;
            color: #8A7565;
            margin-bottom: 2px;
        }

        .indicator-value {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-coral);
        }

        .question-counter {
            font-size: 11px;
            color: var(--cocoa-text);
            text-align: right;
        }

        /* ===== 桌面端优化 ===== */
        @media (min-width: 768px) {
            body {
                padding: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            
            .test-wrapper {
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(93, 75, 64, 0.15);
                overflow: hidden;
                min-height: 600px;
                max-height: 700px;
            }
            
            .top-bar {
                border-radius: 20px 20px 0 0;
            }
            
            .bottom-bar {
                border-radius: 0 0 20px 20px;
                position: static;
            }
            
            .options-container {
                gap: 8px;
            }
            
            .option-item {
                padding: 10px 12px;
                min-height: 50px;
            }
            
            .option-text {
                font-size: 13px;
            }
        }

        /* ===== 小手机优化 ===== */
        @media (max-width: 360px) {
            .pig-avatar {
                width: 50px;
                height: 50px;
            }
            
            .question-text {
                font-size: 16px;
            }
            
            .option-item {
                min-height: 42px;
                padding: 7px 9px;
            }
            
            .option-icon {
                width: 26px;
                height: 26px;
                min-width: 26px;
                font-size: 13px;
            }
            
            .option-text {
                font-size: 12px;
            }
        }

        /* ===== 动画效果 ===== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .option-item {
            animation: fadeIn 0.3s ease forwards;
        }

        /* ===== 交互反馈 ===== */
        .option-item:active {
            transform: scale(0.98);
        }

        /* 为最后一个选项添加底部间距，防止被底部栏遮挡 */
        .question-section {
            padding-bottom: 80px; /* 留出底部栏空间 */
        }

        /* ===== 防止内容被键盘遮挡 ===== */
        @media (max-height: 600px) {
            .question-text {
                font-size: 16px;
            }
            
            .option-item {
                min-height: 40px;
                padding: 6px 8px;
            }
            
            .pig-avatar {
                width: 45px;
                height: 45px;
            }
        }
    </style>
</head>
<body>

<div class="test-wrapper">
    <!-- 顶部栏 -->
    <div class="top-bar">
        <div class="logo">
            <i class="fas fa-heart"></i>
            <span>爱的方言翻译器</span>
        </div>
        <div id="topCounter">第 1/12 题</div>
    </div>

    <!-- 猪八吉区域 -->
    <div class="pig-section">
        <div class="pig-avatar">
            <img src="images/scene_01.jpg" alt="猪八吉" id="pigImage">
        </div>
        <div class="pig-info">
            <div class="pig-speech" id="pigSpeech">媳妇让俺陪你完成这个爱的测试～</div>
            <div class="progress-container">
                <div class="progress-label" id="progressLabel">正在测试中...</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 8.33%;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 题目区域 -->
    <div class="question-section">
        <div class="question-header">
            <div class="question-number">
                <i class="far fa-question-circle"></i> 问题 #<span id="questionNum">1</span>
            </div>
            <div class="question-text" id="questionText">正在加载题目...</div>
            <div class="question-hint">选择最能触动你的选项</div>
        </div>

        <div class="options-container" id="optionsContainer">
            <!-- 选项通过JS动态生成 -->
        </div>
    </div>

    <!-- 底部状态栏 -->
    <div class="bottom-bar">
        <div class="love-type-indicator" id="loveTypeIndicator">
            <div class="indicator-label">当前爱语倾向</div>
            <div class="indicator-value">正在检测中...</div>
        </div>
        <div class="question-counter">
            已完成 <span id="completedCount">0</span>/12 题
        </div>
    </div>
</div>

<script>
    // 题目数据
    const questions = [
        { 
            text: "媳妇过生日，猪八吉怎么做你最暖心？", 
            options: [
                { text: "写张小卡片说'媳妇辛苦了，俺永远爱你'", type: "words", icon: "💬" },
                { text: "承包一个月家务，让媳妇当皇后", type: "acts", icon: "🤗" },
                { text: "精心准备一份礼物，哪怕不贵重", type: "gifts", icon: "🎁" },
                { text: "请一天假，专心陪媳妇逛街聊天", type: "time", icon: "🕰️" },
                { text: "给媳妇一个大大拥抱，说'有你在真好'", type: "touch", icon: "👫" }
            ], 
            speech: "媳妇生日！俺得好好表现～你希望伴侣怎么为你庆祝？" 
        },
        { 
            text: "猪八吉加班晚归，你希望他？", 
            options: [
                { text: "发条消息：'媳妇，俺想你，马上回'", type: "words", icon: "💬" },
                { text: "带宵夜回来，热好了端给你", type: "acts", icon: "🤗" },
                { text: "顺手带枝花或小零食", type: "gifts", icon: "🎁" },
                { text: "回家后放下手机，认真听你说话", type: "time", icon: "🕰️" },
                { text: "进门先抱抱你，亲一下额头", type: "touch", icon: "👫" }
            ], 
            speech: "加班晚了，媳妇在家等俺...怎么做才能让她不生气？" 
        },
        { 
            text: "你们吵架后，哪种和好方式最有效？", 
            options: [
                { text: "对方真诚道歉：'是俺不对'", type: "words", icon: "💬" },
                { text: "默默帮你把活儿干了", type: "acts", icon: "🤗" },
                { text: "送你个小礼物示好", type: "gifts", icon: "🎁" },
                { text: "拉你坐下，耐心沟通", type: "time", icon: "🕰️" },
                { text: "一把抱住你，不松手", type: "touch", icon: "👫" }
            ], 
            speech: "吵架了，媳妇不理俺，咋办？哪种方式最能让她消气？" 
        },
        { 
            text: "日常生活中，你最喜欢怎样表达爱意？", 
            options: [
                { text: "经常说'爱你''想你'", type: "words", icon: "💬" },
                { text: "帮TA挤牙膏、倒水等小事", type: "acts", icon: "🤗" },
                { text: "看到适合TA的东西就买下来", type: "gifts", icon: "🎁" },
                { text: "每天抽时间专门聊天", type: "time", icon: "🕰️" },
                { text: "走路牵手，坐车靠肩", type: "touch", icon: "👫" }
            ], 
            speech: "媳妇说俺不懂浪漫，俺觉得爱要做出来，你说呢？" 
        },
        { 
            text: "心情低落时，最希望TA怎么做？", 
            options: [
                { text: "鼓励你：'你是最棒的'", type: "words", icon: "💬" },
                { text: "为你泡杯茶，做点实际的", type: "acts", icon: "🤗" },
                { text: "送个小玩偶或零食", type: "gifts", icon: "🎁" },
                { text: "陪你散步，安静倾听", type: "time", icon: "🕰️" },
                { text: "搂着你，轻轻拍背", type: "touch", icon: "👫" }
            ], 
            speech: "媳妇心情不好，俺该怎么做？在线等，挺急的！" 
        },
        { 
            text: "纪念日（结婚/恋爱纪念），你更期待怎样庆祝？", 
            options: [
                { text: "写一封情书，当面念给你听", type: "words", icon: "💬" },
                { text: "策划一次家务大扫除，两人一起完成", type: "acts", icon: "🤗" },
                { text: "准备一份惊喜礼物", type: "gifts", icon: "🎁" },
                { text: "安排一次短途旅行，只有你们俩", type: "time", icon: "🕰️" },
                { text: "安排按摩、SPA等身体放松活动", type: "touch", icon: "👫" }
            ], 
            speech: "结婚纪念日到了，俺想给媳妇一个惊喜，你觉得哪种方式好？" 
        },
        { 
            text: "关于家务分工，你最看重什么？", 
            options: [
                { text: "TA常说'辛苦了''谢谢'", type: "words", icon: "💬" },
                { text: "TA主动分担，不用提醒", type: "acts", icon: "🤗" },
                { text: "买智能家电减轻负担", type: "gifts", icon: "🎁" },
                { text: "一起做家务，边做边聊天", type: "time", icon: "🕰️" },
                { text: "干活时给个鼓励的亲吻", type: "touch", icon: "👫" }
            ], 
            speech: "家务活这么多，媳妇嫌俺不干活，咋表现才好？" 
        },
        { 
            text: "异地时（出差/分居），什么最能让你感受到爱？", 
            options: [
                { text: "每天视频说'晚安'", type: "words", icon: "💬" },
                { text: "远程为你点外卖", type: "acts", icon: "🤗" },
                { text: "寄礼物包裹", type: "gifts", icon: "🎁" },
                { text: "长时间视频，一起看剧", type: "time", icon: "🕰️" },
                { text: "期待重逢时的拥抱", type: "touch", icon: "👫" }
            ], 
            speech: "出差在外，想媳妇了，怎么让她感受到俺的爱？" 
        },
        { 
            text: "当你工作压力大时，最需要TA？", 
            options: [
                { text: "说'你已经很优秀了'", type: "words", icon: "💬" },
                { text: "帮你处理生活琐事", type: "acts", icon: "🤗" },
                { text: "送减压小礼物（香薰、按摩仪等）", type: "gifts", icon: "🎁" },
                { text: "陪你吐槽，当情绪垃圾桶", type: "time", icon: "🕰️" },
                { text: "给你按摩肩膀", type: "touch", icon: "👫" }
            ], 
            speech: "媳妇工作压力大，俺想帮她分担，该怎么做？" 
        },
        { 
            text: "理想的周末时光，你希望怎样度过？", 
            options: [
                { text: "互相分享一周的感受", type: "words", icon: "💬" },
                { text: "一起做大餐，合作完成", type: "acts", icon: "🤗" },
                { text: "去逛商场/超市，买喜欢的东西", type: "gifts", icon: "🎁" },
                { text: "发展共同爱好（运动、手工等）", type: "time", icon: "🕰️" },
                { text: "窝在沙发上看电影，靠在一起", type: "touch", icon: "👫" }
            ], 
            speech: "周末了，和媳妇一起做点啥，才能让感情升温？" 
        },
        { 
            text: "关于教育孩子的方式，你们有分歧时，什么最能化解矛盾？", 
            options: [
                { text: "TA说：'你的出发点也是为孩子好'", type: "words", icon: "💬" },
                { text: "TA主动去辅导孩子作业", type: "acts", icon: "🤗" },
                { text: "给孩子买套新玩具/书，转移注意力", type: "gifts", icon: "🎁" },
                { text: "等孩子睡了，坐下来好好讨论教育理念", type: "time", icon: "🕰️" },
                { text: "拍拍你的肩说：'我们都是第一次当父母'", type: "touch", icon: "👫" }
            ], 
            speech: "俺想让孩子多玩，媳妇想让他多学习…吵架了，咋和好？" 
        },
        { 
            text: "关于家庭大额开支（买房/买车/投资），你最看重TA的什么表现？", 
            options: [
                { text: "TA说：'钱可以再赚，你的开心最重要'", type: "words", icon: "💬" },
                { text: "TA认真做预算表，列出各种方案", type: "acts", icon: "🤗" },
                { text: "TA准备一个小惊喜，让你觉得'钱花得值'", type: "gifts", icon: "🎁" },
                { text: "安排专门时间，一起研究各种选择", type: "time", icon: "🕰️" },
                { text: "握着你的手说：'不管怎么决定，我们一起承担'", type: "touch", icon: "👫" }
            ], 
            speech: "想换辆车，媳妇觉得该存钱，俺该咋办才能让她同意？" 
        }
    ];

    const loveTypes = {
        words: { name: "💬 言值派", color: "#FF9494", emoji: "💬" },
        acts: { name: "🤗 行动派", color: "#FF7A7A", emoji: "🤗" },
        gifts: { name: "🎁 仪式派", color: "#E8B054", emoji: "🎁" },
        time: { name: "🕰️ 陪伴派", color: "#FFA07A", emoji: "🕰️" },
        touch: { name: "👫 接触派", color: "#FF8A65", emoji: "👫" }
    };

    let currentIdx = 0;
    let scores = { words: 0, acts: 0, gifts: 0, time: 0, touch: 0 };
    let soundEnabled = false; // 默认关闭音效，减少干扰

    // DOM元素
    const questionTextEl = document.getElementById('questionText');
    const questionNumEl = document.getElementById('questionNum');
    const progressFillEl = document.getElementById('progressFill');
    const progressLabelEl = document.getElementById('progressLabel');
    const pigSpeechEl = document.getElementById('pigSpeech');
    const pigImageEl = document.getElementById('pigImage');
    const optionsContainerEl = document.getElementById('optionsContainer');
    const topCounterEl = document.getElementById('topCounter');
    const loveTypeIndicatorEl = document.getElementById('loveTypeIndicator');
    const completedCountEl = document.getElementById('completedCount');

    // 渲染题目
    function renderQuestion() {
        const q = questions[currentIdx];
        
        // 更新题目信息
        questionTextEl.textContent = q.text;
        questionNumEl.textContent = currentIdx + 1;
        
        // 更新猪八吉区域
        pigSpeechEl.textContent = q.speech;
        pigImageEl.src = `images/scene_${(currentIdx + 1).toString().padStart(2, '0')}.jpg`;
        
        // 更新进度
        const progressPercent = ((currentIdx + 1) / questions.length * 100).toFixed(2);
        progressFillEl.style.width = `${progressPercent}%`;
        progressLabelEl.textContent = `第 ${currentIdx + 1} 题 / 共 ${questions.length} 题`;
        topCounterEl.textContent = `第 ${currentIdx + 1}/12 题`;
        completedCountEl.textContent = currentIdx;
        
        // 清空并生成选项
        optionsContainerEl.innerHTML = '';
        
        // 计算每个选项的动画延迟
        q.options.forEach((option, index) => {
            setTimeout(() => {
                const optionItem = document.createElement('div');
                optionItem.className = 'option-item';
                optionItem.dataset.index = index;
                optionItem.dataset.type = option.type;
                
                const typeColor = loveTypes[option.type].color;
                
                optionItem.innerHTML = `
                    <div class="option-icon" style="color: ${typeColor}">${option.icon}</div>
                    <div class="option-text">${option.text}</div>
                `;
                
                optionItem.addEventListener('click', () => selectOption(option.type, optionItem));
                optionsContainerEl.appendChild(optionItem);
            }, index * 50); // 每个选项延迟50ms出现，创造序列动画
        });
        
        // 更新爱语倾向指示器
        updateLoveTypeIndicator();
    }

    // 选择选项
    function selectOption(type, element) {
        // 移除其他选项的选中状态
        document.querySelectorAll('.option-item.active').forEach(item => {
            item.classList.remove('active');
        });
        
        // 标记当前选项为选中
        element.classList.add('active');
        
        // 增加分数
        scores[type]++;
        
        // 延迟后进入下一题或完成测试
        setTimeout(() => {
            if (currentIdx < questions.length - 1) {
                // 还有下一题
                currentIdx++;
                renderQuestion();
            } else {
                // 完成测试，跳转到结果页
                completeTest();
            }
        }, 300);
    }

    // 更新爱语倾向指示器
    function updateLoveTypeIndicator() {
        // 计算当前最频繁的爱语类型
        const types = Object.entries(scores);
        if (types.every(([_, count]) => count === 0)) {
            loveTypeIndicatorEl.querySelector('.indicator-value').textContent = '正在检测中...';
            return;
        }
        
        const sorted = types.sort((a, b) => b[1] - a[1]);
        const [mainType, count] = sorted[0];
        const typeInfo = loveTypes[mainType];
        
        const percent = Math.round((count / (currentIdx + 1)) * 100);
        loveTypeIndicatorEl.querySelector('.indicator-value').innerHTML = `
            <span style="color: ${typeInfo.color}">${typeInfo.emoji} ${typeInfo.name} (${percent}%)</span>
        `;
    }

    // 完成测试
    function completeTest() {
        // 计算最终结果
        const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
        const mainType = sorted[0][0];
        const mainCount = sorted[0][1];
        
        const result = {
            main: mainType,
            percent: Math.round(mainCount / questions.length * 100),
            all: scores,
            date: new Date().toLocaleString('zh-CN')
        };
        
        // 保存到localStorage
        localStorage.setItem('love_result', JSON.stringify(result));
        
        // 跳转到结果页
        window.location.href = 'result.html';
    }

    // 初始化
    function init() {
        // 渲染第一题
        renderQuestion();
        
        // 键盘支持
        document.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '5') {
                const index = parseInt(e.key) - 1;
                const options = optionsContainerEl.children;
                if (index < options.length) {
                    options[index].click();
                }
            }
        });
        
        // 防止手机端键盘弹出时布局错乱
        window.addEventListener('resize', () => {
            // 重新计算布局
            document.documentElement.style.height = 'initial';
        });
        
        console.log('猪八吉爱的方言翻译器已加载！');
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
