<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猪八吉家传·爱的语言翻译器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-pink: #FF9494;
            --secondary-pink: #FFC4C4;
            --accent-coral: #FF7A7A;
            --accent-gold: #E8B054;
            --warm-cream: #FFF9F0;
            --cocoa-text: #5A4235;
            --white: #FFFFFF;
            --border-warm: #FFD0C9;
            --shadow-light: rgba(93, 75, 64, 0.1);
            --shadow-medium: rgba(93, 75, 64, 0.15);
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #FFF9F0 0%, #FFEFDF 100%);
            color: var(--cocoa-text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== 主容器 ===== */
        .test-container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--white);
            box-shadow: 0 10px 40px var(--shadow-medium);
            min-height: 100vh;
            position: relative;
        }

        /* ===== 单屏题目容器 ===== */
        .question-screen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px 20px 30px;
            position: relative;
            overflow: hidden;
        }

        /* 装饰性背景元素 */
        .question-screen::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -20%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 148, 148, 0.08) 0%, transparent 70%);
            z-index: 0;
        }

        .question-screen::after {
            content: '';
            position: absolute;
            bottom: -20%;
            left: -15%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(232, 176, 84, 0.06) 0%, transparent 70%);
            z-index: 0;
        }

        /* 场景图片容器 */
        .scene-image-container {
            width: 100%;
            max-width: 400px;
            height: auto;
            aspect-ratio: 3/4;
            border-radius: 20px;
            border: 8px solid var(--white);
            box-shadow: 0 15px 40px var(--shadow-medium);
            overflow: hidden;
            position: relative;
            z-index: 1;
            margin: 0 auto 20px;
            transition: all 0.4s ease;
        }

        .scene-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .scene-image:hover {
            transform: scale(1.02);
        }

        /* 猪八吉对话气泡 */
        .pig-speech-container {
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 1;
            margin: 0 auto 25px;
        }

        .pig-speech-bubble {
            background: var(--cocoa-text);
            color: white;
            padding: 18px 22px;
            border-radius: 24px;
            font-size: 17px;
            line-height: 1.5;
            box-shadow: 0 10px 30px rgba(93, 75, 64, 0.25);
            position: relative;
            animation: float 3s ease-in-out infinite;
            text-align: center;
            font-weight: 500;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .pig-speech-bubble::after {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-bottom: 14px solid var(--cocoa-text);
        }

        /* 进度条 */
        .progress-container {
            margin-bottom: 25px;
            position: relative;
            z-index: 2;
        }

        .progress-label {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 14px;
            margin-bottom: 15px;
            color: var(--cocoa-text);
            font-weight: 500;
        }

        .progress-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-coral);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .progress-title i {
            font-size: 20px;
        }

        .progress-text {
            font-size: 15px;
            color: #8A7565;
            text-align: center;
        }

        .progress-bar {
            height: 12px;
            background: #F2E9E1;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.08);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(to right, var(--accent-coral), var(--accent-gold));
            border-radius: 10px;
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* 题目内容 */
        .question-header {
            margin-bottom: 25px;
            position: relative;
            z-index: 2;
        }

        .question-number {
            font-size: 15px;
            color: var(--accent-coral);
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .question-number i {
            font-size: 18px;
        }

        .question-text {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 15px;
            color: var(--cocoa-text);
        }

        .question-hint {
            font-size: 15px;
            color: #8A7565;
            font-style: italic;
            text-align: center;
        }

        /* 选项容器 */
        .options-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 25px;
            position: relative;
            z-index: 2;
        }

        .option-item {
            padding: 20px 24px;
            background: var(--white);
            border: 3px solid #F2E9E1;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 18px;
            position: relative;
            overflow: hidden;
        }

        .option-item:hover {
            border-color: var(--secondary-pink);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px var(--shadow-light);
        }

        .option-item.active {
            background: linear-gradient(135deg, rgba(255, 249, 249, 0.9), white);
            border-color: var(--accent-coral);
            box-shadow: 0 10px 30px rgba(255, 122, 122, 0.25);
            transform: translateY(-3px);
        }

        .option-item.active .option-icon {
            background: linear-gradient(135deg, var(--accent-coral), var(--accent-gold));
            color: white;
            transform: scale(1.1);
        }

        .option-item.active::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(to right, var(--accent-coral), var(--accent-gold));
        }

        .option-icon {
            font-size: 24px;
            background: #fdf2f2;
            width: 50px;
            height: 50px;
            min-width: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .option-text {
            font-size: 17px;
            line-height: 1.5;
            font-weight: 500;
            flex: 1;
        }

        /* 爱语倾向指示器 */
        .love-type-indicator {
            background: linear-gradient(135deg, #FFF9F0, #FFF5E1);
            padding: 20px;
            border-radius: 18px;
            border: 3px solid var(--border-warm);
            text-align: center;
            position: relative;
            z-index: 2;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin-top: 10px;
        }

        .indicator-label {
            font-size: 14px;
            color: #8A7565;
            margin-bottom: 10px;
        }

        .indicator-value {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent-coral);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding: 0 5px;
        }

        /* 向下滑动提示（仅当选项需要滚动时显示） */
        .scroll-hint-bottom {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--accent-coral);
            font-size: 14px;
            font-weight: 600;
            padding: 15px;
            margin-top: 10px;
            animation: bounce 2s infinite;
            position: relative;
            z-index: 2;
        }

        .scroll-hint-bottom i {
            font-size: 20px;
            margin-bottom: 5px;
        }

        /* 音效开关 */
        .sound-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--white);
            border: 2px solid var(--border-warm);
            color: var(--accent-coral);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .sound-toggle:hover {
            transform: scale(1.1);
            border-color: var(--accent-coral);
        }

        /* 桌面端适配 */
        @media (min-width: 768px) {
            body {
                background: linear-gradient(135deg, #FFF9F0 0%, #FFEFDF 100%);
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                padding: 20px;
            }
            
            .test-container {
                border-radius: 24px;
                overflow: hidden;
                max-height: 90vh;
                box-shadow: 0 20px 60px rgba(93, 75, 64, 0.2);
            }
            
            .question-screen {
                overflow-y: auto;
                max-height: 90vh;
            }
        }

        /* 响应式调整 */
        @media (max-width: 768px) {
            .question-screen {
                padding: 15px 15px 25px;
            }
            
            .scene-image-container {
                max-width: 350px;
                border-width: 6px;
                border-radius: 18px;
                margin-bottom: 18px;
            }
            
            .pig-speech-bubble {
                padding: 16px 20px;
                font-size: 16px;
                border-radius: 20px;
            }
            
            .question-text {
                font-size: 22px;
            }
            
            .option-item {
                padding: 18px 22px;
                gap: 16px;
            }
            
            .option-icon {
                width: 46px;
                height: 46px;
                min-width: 46px;
                font-size: 22px;
            }
            
            .option-text {
                font-size: 16px;
            }
            
            .sound-toggle {
                width: 45px;
                height: 45px;
                font-size: 20px;
                bottom: 15px;
                right: 15px;
            }
        }

        @media (max-width: 480px) {
            .question-screen {
                padding: 12px 12px 22px;
            }
            
            .scene-image-container {
                max-width: 320px;
                aspect-ratio: 3/4;
            }
            
            .pig-speech-bubble {
                padding: 14px 18px;
                font-size: 15px;
                line-height: 1.4;
            }
            
            .question-text {
                font-size: 20px;
            }
            
            .option-item {
                padding: 16px 20px;
                gap: 14px;
                border-radius: 16px;
            }
            
            .option-icon {
                width: 42px;
                height: 42px;
                min-width: 42px;
                font-size: 20px;
                border-radius: 12px;
            }
            
            .option-text {
                font-size: 15px;
            }
            
            .love-type-indicator {
                padding: 18px;
                border-radius: 16px;
            }
            
            .sound-toggle {
                width: 42px;
                height: 42px;
                font-size: 18px;
                bottom: 12px;
                right: 12px;
            }
        }

        @media (max-width: 360px) {
            .scene-image-container {
                max-width: 280px;
                border-width: 5px;
                border-radius: 16px;
            }
            
            .pig-speech-bubble {
                padding: 12px 16px;
                font-size: 14px;
                border-radius: 18px;
            }
            
            .question-text {
                font-size: 18px;
            }
            
            .option-text {
                font-size: 14px;
            }
        }

        /* 滚动条美化 */
        .question-screen::-webkit-scrollbar {
            width: 6px;
        }

        .question-screen::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        .question-screen::-webkit-scrollbar-thumb {
            background: var(--secondary-pink);
            border-radius: 3px;
        }

        .question-screen::-webkit-scrollbar-thumb:hover {
            background: var(--primary-pink);
        }
    </style>
</head>
<body>

<div class="test-container">
    <!-- 单屏题目容器 -->
    <div class="question-screen" id="questionScreen">
        <!-- 场景图片容器 -->
        <div class="scene-image-container">
            <img src="images/scene_01.jpg" alt="猪八吉与媳妇的温馨场景" class="scene-image" id="sceneImage">
        </div>
        
        <!-- 猪八吉对话气泡 -->
        <div class="pig-speech-container">
            <div class="pig-speech-bubble" id="pigSpeech">媳妇让俺陪你完成这个爱的测试～</div>
        </div>
        
        <!-- 进度条 -->
        <div class="progress-container">
            <div class="progress-label">
                <div class="progress-title">
                    <i class="fas fa-heart"></i> 猪八吉家传、爱的语言翻译器
                </div>
                <div class="progress-text" id="progressText">第 1 题 / 共 12 题</div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 8.33%;"></div>
            </div>
        </div>

        <!-- 题目内容 -->
        <div class="question-header">
            <div class="question-number">
                <i class="far fa-question-circle"></i> 问题 #<span id="questionNum">1</span>
            </div>
            <div class="question-text" id="questionText">正在加载题目...</div>
            <div class="question-hint">选择最能触动你的选项</div>
        </div>

        <!-- 选项容器 -->
        <div class="options-container" id="optionsContainer">
            <!-- 选项将通过JavaScript动态生成 -->
        </div>
        
        <!-- 爱语倾向指示器 -->
        <div class="love-type-indicator" id="loveTypeIndicator">
            <div class="indicator-label">当前爱语倾向</div>
            <div class="indicator-value">正在检测中...</div>
        </div>
        
        <!-- 向下滑动提示（仅在需要时显示） -->
        <div class="scroll-hint-bottom" id="scrollHintBottom">
            <i class="fas fa-chevron-down"></i>
            <span>滑动查看更多选项</span>
        </div>
    </div>
</div>

<!-- 音效开关 -->
<div class="sound-toggle" id="soundToggle" title="音效开关">
    <i class="fas fa-volume-up"></i>
</div>

<script>
    // 题目数据
    const questions = [
        { 
            text: "媳妇过生日，猪八吉怎么做你最暖心？", 
            options: [
                { text: "写张小卡片说'媳妇辛苦了，俺永远爱你'", type: "words", icon: "💬" },
                { text: "承包一个月家务，让媳妇当皇后", type: "acts", icon: "🤗" },
                { text: "精心准备一份礼物，哪怕不贵重", type: "gifts", icon: "🎁" },
                { text: "请一天假，专心陪媳妇逛街聊天", type: "time", icon: "🕰️" },
                { text: "给媳妇一个大大拥抱，说'有你在真好'", type: "touch", icon: "👫" }
            ], 
            speech: "媳妇生日！俺得好好表现～你希望伴侣怎么为你庆祝？" 
        },
        { 
            text: "猪八吉加班晚归，你希望他？", 
            options: [
                { text: "发条消息：'媳妇，俺想你，马上回'", type: "words", icon: "💬" },
                { text: "带宵夜回来，热好了端给你", type: "acts", icon: "🤗" },
                { text: "顺手带枝花或小零食", type: "gifts", icon: "🎁" },
                { text: "回家后放下手机，认真听你说话", type: "time", icon: "🕰️" },
                { text: "进门先抱抱你，亲一下额头", type: "touch", icon: "👫" }
            ], 
            speech: "加班晚了，媳妇在家等俺...怎么做才能让她不生气？" 
        },
        { 
            text: "你们吵架后，哪种和好方式最有效？", 
            options: [
                { text: "对方真诚道歉：'是俺不对'", type: "words", icon: "💬" },
                { text: "默默帮你把活儿干了", type: "acts", icon: "🤗" },
                { text: "送你个小礼物示好", type: "gifts", icon: "🎁" },
                { text: "拉你坐下，耐心沟通", type: "time", icon: "🕰️" },
                { text: "一把抱住你，不松手", type: "touch", icon: "👫" }
            ], 
            speech: "吵架了，媳妇不理俺，咋办？哪种方式最能让她消气？" 
        },
        { 
            text: "日常生活中，你最喜欢怎样表达爱意？", 
            options: [
                { text: "经常说'爱你''想你'", type: "words", icon: "💬" },
                { text: "帮TA挤牙膏、倒水等小事", type: "acts", icon: "🤗" },
                { text: "看到适合TA的东西就买下来", type: "gifts", icon: "🎁" },
                { text: "每天抽时间专门聊天", type: "time", icon: "🕰️" },
                { text: "走路牵手，坐车靠肩", type: "touch", icon: "👫" }
            ], 
            speech: "媳妇说俺不懂浪漫，俺觉得爱要做出来，你说呢？" 
        },
        { 
            text: "心情低落时，最希望TA怎么做？", 
            options: [
                { text: "鼓励你：'你是最棒的'", type: "words", icon: "💬" },
                { text: "为你泡杯茶，做点实际的", type: "acts", icon: "🤗" },
                { text: "送个小玩偶或零食", type: "gifts", icon: "🎁" },
                { text: "陪你散步，安静倾听", type: "time", icon: "🕰️" },
                { text: "搂着你，轻轻拍背", type: "touch", icon: "👫" }
            ], 
            speech: "媳妇心情不好，俺该怎么做？在线等，挺急的！" 
        },
        { 
            text: "纪念日（结婚/恋爱纪念），你更期待怎样庆祝？", 
            options: [
                { text: "写一封情书，当面念给你听", type: "words", icon: "💬" },
                { text: "策划一次家务大扫除，两人一起完成", type: "acts", icon: "🤗" },
                { text: "准备一份惊喜礼物", type: "gifts", icon: "🎁" },
                { text: "安排一次短途旅行，只有你们俩", type: "time", icon: "🕰️" },
                { text: "安排按摩、SPA等身体放松活动", type: "touch", icon: "👫" }
            ], 
            speech: "结婚纪念日到了，俺想给媳妇一个惊喜，你觉得哪种方式好？" 
        },
        { 
            text: "关于家务分工，你最看重什么？", 
            options: [
                { text: "TA常说'辛苦了''谢谢'", type: "words", icon: "💬" },
                { text: "TA主动分担，不用提醒", type: "acts", icon: "🤗" },
                { text: "买智能家电减轻负担", type: "gifts", icon: "🎁" },
                { text: "一起做家务，边做边聊天", type: "time", icon: "🕰️" },
                { text: "干活时给个鼓励的亲吻", type: "touch", icon: "👫" }
            ], 
            speech: "家务活这么多，媳妇嫌俺不干活，咋表现才好？" 
        },
        { 
            text: "异地时（出差/分居），什么最能让你感受到爱？", 
            options: [
                { text: "每天视频说'晚安'", type: "words", icon: "💬" },
                { text: "远程为你点外卖", type: "acts", icon: "🤗" },
                { text: "寄礼物包裹", type: "gifts", icon: "🎁" },
                { text: "长时间视频，一起看剧", type: "time", icon: "🕰️" },
                { text: "期待重逢时的拥抱", type: "touch", icon: "👫" }
            ], 
            speech: "出差在外，想媳妇了，怎么让她感受到俺的爱？" 
        },
        { 
            text: "当你工作压力大时，最需要TA？", 
            options: [
                { text: "说'你已经很优秀了'", type: "words", icon: "💬" },
                { text: "帮你处理生活琐事", type: "acts", icon: "🤗" },
                { text: "送减压小礼物（香薰、按摩仪等）", type: "gifts", icon: "🎁" },
                { text: "陪你吐槽，当情绪垃圾桶", type: "time", icon: "🕰️" },
                { text: "给你按摩肩膀", type: "touch", icon: "👫" }
            ], 
            speech: "媳妇工作压力大，俺想帮她分担，该怎么做？" 
        },
        { 
            text: "理想的周末时光，你希望怎样度过？", 
            options: [
                { text: "互相分享一周的感受", type: "words", icon: "💬" },
                { text: "一起做大餐，合作完成", type: "acts", icon: "🤗" },
                { text: "去逛商场/超市，买喜欢的东西", type: "gifts", icon: "🎁" },
                { text: "发展共同爱好（运动、手工等）", type: "time", icon: "🕰️" },
                { text: "窝在沙发上看电影，靠在一起", type: "touch", icon: "👫" }
            ], 
            speech: "周末了，和媳妇一起做点啥，才能让感情升温？" 
        },
        { 
            text: "关于教育孩子的方式，你们有分歧时，什么最能化解矛盾？", 
            options: [
                { text: "TA说：'你的出发点也是为孩子好'", type: "words", icon: "💬" },
                { text: "TA主动去辅导孩子作业", type: "acts", icon: "🤗" },
                { text: "给孩子买套新玩具/书，转移注意力", type: "gifts", icon: "🎁" },
                { text: "等孩子睡了，坐下来好好讨论教育理念", type: "time", icon: "🕰️" },
                { text: "拍拍你的肩说：'我们都是第一次当父母'", type: "touch", icon: "👫" }
            ], 
            speech: "俺想让孩子多玩，媳妇想让他多学习…吵架了，咋和好？" 
        },
        { 
            text: "关于家庭大额开支（买房/买车/投资），你最看重TA的什么表现？", 
            options: [
                { text: "TA说：'钱可以再赚，你的开心最重要'", type: "words", icon: "💬" },
                { text: "TA认真做预算表，列出各种方案", type: "acts", icon: "🤗" },
                { text: "TA准备一个小惊喜，让你觉得'钱花得值'", type: "gifts", icon: "🎁" },
                { text: "安排专门时间，一起研究各种选择", type: "time", icon: "🕰️" },
                { text: "握着你的手说：'不管怎么决定，我们一起承担'", type: "touch", icon: "👫" }
            ], 
            speech: "想换辆车，媳妇觉得该存钱，俺该咋办才能让她同意？" 
        }
    ];

    const loveTypes = {
        words: { name: "言语派", color: "#FF9494", emoji: "💬" },
        acts: { name: "行动派", color: "#FF7A7A", emoji: "🤗" },
        gifts: { name: "仪式派", color: "#E8B054", emoji: "🎁" },
        time: { name: "陪伴派", color: "#FFA07A", emoji: "🕰️" },
        touch: { name: "情感派", color: "#FF8A65", emoji: "👫" }
    };

    let currentIdx = 0;
    let scores = { words: 0, acts: 0, gifts: 0, time: 0, touch: 0 };
    let soundEnabled = true;

    const sceneImageEl = document.getElementById('sceneImage');
    const pigSpeechEl = document.getElementById('pigSpeech');
    const questionTextEl = document.getElementById('questionText');
    const questionNumEl = document.getElementById('questionNum');
    const progressTextEl = document.getElementById('progressText');
    const progressFillEl = document.getElementById('progressFill');
    const optionsContainerEl = document.getElementById('optionsContainer');
    const loveTypeIndicatorEl = document.getElementById('loveTypeIndicator');
    const soundToggleEl = document.getElementById('soundToggle');
    const questionScreenEl = document.getElementById('questionScreen');
    const scrollHintBottomEl = document.getElementById('scrollHintBottom');

    function renderQuestion() {
        const q = questions[currentIdx];
        
        sceneImageEl.src = `images/scene_${(currentIdx + 1).toString().padStart(2, '0')}.jpg`;
        pigSpeechEl.textContent = q.speech;
        
        questionTextEl.textContent = q.text;
        questionNumEl.textContent = currentIdx + 1;
        
        const progressPercent = ((currentIdx + 1) / questions.length * 100).toFixed(2);
        progressFillEl.style.width = `${progressPercent}%`;
        progressTextEl.textContent = `第 ${currentIdx + 1} 题 / 共 ${questions.length} 题`;
        
        optionsContainerEl.innerHTML = '';
        
        q.options.forEach((option, index) => {
            const optionItem = document.createElement('div');
            optionItem.className = 'option-item';
            optionItem.dataset.index = index;
            optionItem.dataset.type = option.type;
            
            const typeColor = loveTypes[option.type].color;
            
            optionItem.innerHTML = `
                <div class="option-icon" style="color: ${typeColor}">${option.icon}</div>
                <div class="option-text">${option.text}</div>
            `;
            
            optionItem.addEventListener('click', () => selectOption(option.type, optionItem));
            optionsContainerEl.appendChild(optionItem);
        });
        
        updateLoveTypeIndicator();
        checkScrollNeeded();
        
        // 每次渲染新题目时，确保滚动到顶部
        questionScreenEl.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }

    function selectOption(type, element) {
        if (soundEnabled) {
            const audio = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-select-click-1109.mp3');
            audio.volume = 0.3;
            audio.play().catch(e => console.log("音效播放被阻止"));
        }
        
        element.classList.add('active');
        sceneImageEl.style.transform = 'scale(1.05) rotate(1deg)';
        scores[type]++;
        
        createRippleEffect(element, loveTypes[type].color);
        
        // 立即开始平滑滚动到顶部（场景图位置）
        questionScreenEl.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
        
        setTimeout(() => {
            sceneImageEl.style.transform = '';
            
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                renderQuestion();
            } else {
                completeTest();
            }
        }, 800);
    }

    function createRippleEffect(element, color) {
        const ripple = document.createElement('span');
        const rect = element.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const x = rect.width / 2;
        const y = rect.height / 2;
        
        ripple.style.cssText = `
            position: absolute;
            border-radius: 50%;
            background: ${color}40;
            width: ${size}px;
            height: ${size}px;
            left: ${x - size/2}px;
            top: ${y - size/2}px;
            transform: scale(0);
            animation: ripple 0.6s linear;
            z-index: 1;
        `;
        
        element.style.position = 'relative';
        element.appendChild(ripple);
        
        if (!document.getElementById('ripple-animation')) {
            const style = document.createElement('style');
            style.id = 'ripple-animation';
            style.textContent = `
                @keyframes ripple {
                    to { transform: scale(4); opacity: 0; }
                }
            `;
            document.head.appendChild(style);
        }
        
        setTimeout(() => ripple.remove(), 600);
    }

    function updateLoveTypeIndicator() {
        const types = Object.entries(scores);
        if (types.every(([_, count]) => count === 0)) {
            loveTypeIndicatorEl.querySelector('.indicator-value').textContent = '正在检测中...';
            loveTypeIndicatorEl.style.borderColor = 'var(--border-warm)';
            return;
        }
        
        const sorted = types.sort((a, b) => b[1] - a[1]);
        const [mainType, count] = sorted[0];
        const typeInfo = loveTypes[mainType];
        
        const percent = Math.round((count / (currentIdx + 1)) * 100);
        loveTypeIndicatorEl.querySelector('.indicator-value').innerHTML = `
            <span style="color: ${typeInfo.color}">${typeInfo.emoji} ${typeInfo.name} (${percent}%)</span>
        `;
        
        loveTypeIndicatorEl.style.borderColor = typeInfo.color;
    }

    function checkScrollNeeded() {
        // 检查选项容器是否需要滚动
        setTimeout(() => {
            const optionsHeight = optionsContainerEl.scrollHeight;
            const screenHeight = questionScreenEl.clientHeight;
            const optionsTop = optionsContainerEl.offsetTop;
            
            // 如果选项容器的高度加上其顶部位置超过了屏幕高度，则显示滚动提示
            if (optionsHeight + optionsTop > screenHeight * 0.9) {
                scrollHintBottomEl.style.display = 'flex';
            } else {
                scrollHintBottomEl.style.display = 'none';
            }
        }, 100);
    }

    function completeTest() {
        const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
        const mainType = sorted[0][0];
        const mainCount = sorted[0][1];
        
        const result = {
            main: mainType,
            percent: Math.round(mainCount / questions.length * 100),
            all: scores,
            date: new Date().toLocaleString('zh-CN')
        };
        
        localStorage.setItem('love_result', JSON.stringify(result));
        
        showCompletionAnimation();
        
        setTimeout(() => {
            window.location.href = 'result.html';
        }, 2000);
    }

    function showCompletionAnimation() {
        sceneImageEl.style.transform = 'scale(1.1)';
        sceneImageEl.style.transition = 'transform 1s ease';
        
        pigSpeechEl.textContent = '测试完成啦！正在生成你的专属报告...';
        pigSpeechEl.style.backgroundColor = loveTypes[Object.entries(scores).sort((a, b) => b[1] - a[1])[0][0]].color;
        
        // 隐藏选项和提示
        optionsContainerEl.style.opacity = '0.3';
        scrollHintBottomEl.style.opacity = '0';
        
        // 显示完成动画
        const completionMsg = document.createElement('div');
        completionMsg.innerHTML = `
            <div style="text-align: center; margin-top: 20px; padding: 20px; background: linear-gradient(135deg, #FF9494, #FF7A7A); color: white; border-radius: 20px; font-size: 18px; font-weight: bold;">
                <i class="fas fa-heart" style="font-size: 24px; margin-bottom: 10px;"></i><br>
                测试完成！正在分析你的爱语类型...
            </div>
        `;
        loveTypeIndicatorEl.parentNode.insertBefore(completionMsg, loveTypeIndicatorEl.nextSibling);
    }

    function toggleSound() {
        soundEnabled = !soundEnabled;
        const icon = soundToggleEl.querySelector('i');
        
        if (soundEnabled) {
            icon.className = 'fas fa-volume-up';
            soundToggleEl.style.color = 'var(--accent-coral)';
            soundToggleEl.style.borderColor = 'var(--accent-coral)';
        } else {
            icon.className = 'fas fa-volume-mute';
            soundToggleEl.style.color = '#999';
            soundToggleEl.style.borderColor = '#999';
        }
        
        localStorage.setItem('love_test_sound', soundEnabled);
    }

    function init() {
        renderQuestion();
        
        soundToggleEl.addEventListener('click', toggleSound);
        
        const savedSound = localStorage.getItem('love_test_sound');
        if (savedSound !== null) {
            soundEnabled = savedSound === 'true';
            toggleSound();
        }
        
        // 监听窗口大小变化，检查是否需要显示滚动提示
        window.addEventListener('resize', checkScrollNeeded);
        
        // 监听滚动事件，当用户滚动到一定位置时隐藏滚动提示
        questionScreenEl.addEventListener('scroll', function() {
            if (questionScreenEl.scrollTop > 100) {
                scrollHintBottomEl.style.opacity = '0';
                scrollHintBottomEl.style.transition = 'opacity 0.5s ease';
            } else {
                scrollHintBottomEl.style.opacity = '1';
            }
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '5') {
                const index = parseInt(e.key) - 1;
                const options = optionsContainerEl.children;
                if (index < options.length) {
                    options[index].click();
                }
            }
        });
        
        console.log('猪八吉爱的语言翻译器已加载！');
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
