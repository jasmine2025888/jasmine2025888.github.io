<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猪八吉家传·爱的方言翻译器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-pink: #FF9494;
            --accent-coral: #FF7A7A;
            --accent-gold: #E8B054;
            --cocoa-text: #5A4235;
            --white: #FFFFFF;
            --border-warm: #FFD0C9;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        body {
            font-family: 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #FFF9F0 0%, #FFEFDF 100%);
            color: var(--cocoa-text);
            min-height: 100vh;
            padding: 12px;
        }

        /* ===== 顶部区域 ===== */
        .top-section {
            background: linear-gradient(to bottom, var(--white), #FFFCF8);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 4px 12px rgba(93, 75, 64, 0.08);
            border: 2px solid var(--border-warm);
        }

        .pig-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .pig-avatar {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            border: 3px solid var(--white);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .pig-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .pig-info {
            flex: 1;
        }

        .pig-speech {
            background: var(--cocoa-text);
            color: white;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.4;
            position: relative;
            margin-bottom: 5px;
        }

        .pig-speech::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 20px;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 8px solid var(--cocoa-text);
        }

        .question-counter {
            font-size: 12px;
            color: #8A7565;
            text-align: center;
            margin-top: 5px;
        }

        /* ===== 进度条 ===== */
        .progress-container {
            margin: 15px 0 10px 0;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 6px;
            color: var(--cocoa-text);
            font-weight: 500;
        }

        .progress-bar {
            height: 6px;
            background: #F2E9E1;
            border-radius: 6px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(to right, var(--accent-coral), var(--accent-gold));
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        /* ===== 题目区域 ===== */
        .question-section {
            background: var(--white);
            border-radius: 20px;
            padding: 18px 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(93, 75, 64, 0.08);
            border: 2px solid var(--border-warm);
        }

        .question-header {
            margin-bottom: 16px;
        }

        .question-number {
            font-size: 12px;
            color: var(--accent-coral);
            font-weight: 600;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .question-text {
            font-size: 19px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 8px;
        }

        .question-hint {
            font-size: 12px;
            color: #8A7565;
            font-style: italic;
        }

        /* ===== 选项区域 - 紧凑设计 ===== */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 50vh;
            overflow-y: auto;
        }

        .option-item {
            padding: 10px 12px;
            background: var(--white);
            border: 2px solid #F2E9E1;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 52px;
            position: relative;
        }

        .option-icon {
            font-size: 16px;
            background: #fdf2f2;
            width: 34px;
            height: 34px;
            min-width: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .option-text {
            font-size: 13.5px;
            line-height: 1.3;
            font-weight: 500;
            flex: 1;
        }

        .option-item:hover {
            border-color: var(--accent-coral);
        }

        .option-item.active {
            background: linear-gradient(135deg, rgba(255, 249, 249, 0.9), white);
            border-color: var(--accent-coral);
            box-shadow: 0 3px 10px rgba(255, 122, 122, 0.15);
        }

        .option-item.active .option-icon {
            background: linear-gradient(135deg, var(--accent-coral), var(--accent-gold));
            color: white;
        }

        .option-item.active::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(to right, var(--accent-coral), var(--accent-gold));
        }

        /* ===== 底部状态栏 ===== */
        .bottom-section {
            background: linear-gradient(135deg, #FFF9F0, #FFF5E1);
            border-radius: 18px;
            padding: 15px;
            margin-top: 10px;
            border: 2px solid var(--border-warm);
        }

        .love-type-indicator {
            text-align: center;
            margin-bottom: 12px;
        }

        .indicator-label {
            font-size: 11px;
            color: #8A7565;
            margin-bottom: 4px;
        }

        .indicator-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-coral);
        }

        .tips {
            font-size: 11px;
            color: #8A7565;
            text-align: center;
            margin-top: 8px;
        }

        /* ===== 桌面端优化 ===== */
        @media (min-width: 768px) {
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }
            
            .test-container {
                display: flex;
                max-width: 900px;
                width: 100%;
                background: linear-gradient(to bottom, var(--white), #FFFCF8);
                border-radius: 25px;
                box-shadow: 0 15px 40px rgba(93, 75, 64, 0.12);
                overflow: hidden;
                min-height: 600px;
            }
            
            .left-column {
                flex: 1;
                padding: 30px;
                background: linear-gradient(135deg, #FFF9F3, #FFF5ED);
                display: flex;
                flex-direction: column;
                border-right: 2px solid var(--border-warm);
            }
            
            .pig-avatar {
                width: 200px;
                height: 200px;
                align-self: center;
                margin-bottom: 20px;
            }
            
            .right-column {
                flex: 1.4;
                padding: 30px;
                display: flex;
                flex-direction: column;
            }
            
            .options-container {
                max-height: none;
                overflow-y: visible;
            }
        }

        /* ===== 滚动条美化 ===== */
        .options-container::-webkit-scrollbar {
            width: 4px;
        }

        .options-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        .options-container::-webkit-scrollbar-thumb {
            background: var(--accent-coral);
            border-radius: 4px;
        }

        /* ===== 动画效果 ===== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .top-section, .question-section, .bottom-section {
            animation: fadeIn 0.3s ease forwards;
        }

        /* ===== 辅助类 ===== */
        .hidden {
            display: none;
        }

        .sound-toggle {
            position: fixed;
            bottom: 10px;
            right: 10px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--white);
            border: 2px solid var(--border-warm);
            color: var(--accent-coral);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
            z-index: 100;
        }
    </style>
</head>

<script>
    // 题目数据
    const questions = [

    let soundEnabled = true;

    // 检测设备类型
    function isMobile() {
        return window.innerWidth <= 768;
    }

    // 获取DOM元素（根据设备）
    function getElements() {
        if (isMobile()) {
            return {
                questionText: document.getElementById('questionText'),
                questionNum: document.getElementById('questionNum'),
                progressText: document.getElementById('progressText'),
                progressFill: document.getElementById('progressFill'),
                pigSpeech: document.getElementById('pigSpeech'),
                pigImage: document.getElementById('pigImage'),
                optionsContainer: document.getElementById('optionsContainer'),
                questionCounter: document.getElementById('questionCounter'),
                loveTypeIndicator: document.getElementById('loveTypeIndicator')
            };
        } else {
            return {
                questionText: document.getElementById('desktopQuestionText'),
                questionNum: document.getElementById('desktopQuestionNum'),
                progressText: document.getElementById('desktopProgressText'),
                progressFill: document.getElementById('desktopProgressFill'),
                pigSpeech: document.getElementById('desktopPigSpeech'),
                pigImage: document.getElementById('desktopPigImage'),
                optionsContainer: document.getElementById('desktopOptionsContainer'),
                questionCounter: document.getElementById('desktopQuestionCounter'),
                loveTypeIndicator: document.getElementById('desktopLoveTypeIndicator')
            };
        }
    }

    // 渲染题目
    function renderQuestion() {
        const q = questions[currentIdx];
        const els = getElements();
        
        // 更新题目信息
        els.questionText.textContent = q.text;
        els.questionNum.textContent = currentIdx + 1;
        
        // 更新猪八吉区域
        els.pigSpeech.textContent = q.speech;
        els.pigImage.src = `images/scene_${(currentIdx + 1).toString().padStart(2, '0')}.jpg`;
        
        // 更新进度
        const progressPercent = ((currentIdx + 1) / questions.length * 100).toFixed(2);
        els.progressFill.style.width = `${progressPercent}%`;
        els.progressText.textContent = `第 ${currentIdx + 1} 题 / 共 ${questions.length} 题`;
        els.questionCounter.textContent = `第 ${currentIdx + 1}/${questions.length} 题`;
        
        // 清空并生成选项
        els.optionsContainer.innerHTML = '';
        
        q.options.forEach((option, index) => {
            const optionItem = document.createElement('div');
            optionItem.className = 'option-item';
            optionItem.dataset.index = index;
            optionItem.dataset.type = option.type;
            
            const typeColor = loveTypes[option.type].color;
            
            optionItem.innerHTML = `
                <div class="option-icon" style="color: ${typeColor}">${option.icon}</div>
                <div class="option-text">${option.text}</div>
            `;
            
            optionItem.addEventListener('click', () => selectOption(option.type, optionItem));
            els.optionsContainer.appendChild(optionItem);
        });
        
        // 更新爱语倾向指示器
        updateLoveTypeIndicator();
    }

    // 选择选项
    function selectOption(type, element) {
        if (soundEnabled) {
            const audio = new Audio('https://assets.mixkit.co/sfx/preview/mixkit-select-click-1109.mp3');
            audio.volume = 0.2;
            audio.play().catch(() => {});
        }
        
        element.classList.add('active');
        
        // 动画效果
        const els = getElements();
        els.pigSpeech.style.backgroundColor = loveTypes[type].color;
        
        scores[type]++;
        
        setTimeout(() => {
            els.pigSpeech.style.backgroundColor = '';
            
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                renderQuestion();
            } else {
                completeTest();
            }
        }, 400);
    }

    // 更新爱语倾向指示器
    function updateLoveTypeIndicator() {
        const els = getElements();
        const types = Object.entries(scores);
        
        if (types.every(([_, count]) => count === 0)) {
            els.loveTypeIndicator.querySelector('.indicator-value').textContent = '正在检测中...';
            return;
        }
        
        const sorted = types.sort((a, b) => b[1] - a[1]);
        const [mainType, count] = sorted[0];
        const typeInfo = loveTypes[mainType];
        
        const percent = Math.round((count / (currentIdx + 1)) * 100);
        els.loveTypeIndicator.querySelector('.indicator-value').innerHTML = `
            <span style="color: ${typeInfo.color}">${typeInfo.emoji} ${typeInfo.name} (${percent}%)</span>
        `;
        
        // 更新指示器边框颜色
        els.loveTypeIndicator.style.borderColor = typeInfo.color;
    }

    // 完成测试
    function completeTest() {
        const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
        const mainType = sorted[0][0];
        const mainCount = sorted[0][1];
        
        const result = {
            main: mainType,
            percent: Math.round(mainCount / questions.length * 100),
            all: scores,
            date: new Date().toLocaleString('zh-CN')
        };
        
        localStorage.setItem('love_result', JSON.stringify(result));
        window.location.href = 'result.html';
    }

    // 切换设备视图
    function toggleView() {
        const mobileView = document.getElementById('mobileView');
        const desktopView = document.getElementById('desktopView');
        
        if (isMobile()) {
            mobileView.classList.remove('hidden');
            desktopView.classList.add('hidden');
        } else {
            mobileView.classList.add('hidden');
            desktopView.classList.remove('hidden');
        }
    }

    // 音效控制
    function toggleSound() {
        soundEnabled = !soundEnabled;
        const icon = document.getElementById('soundToggle').querySelector('i');
        
        if (soundEnabled) {
            icon.className = 'fas fa-volume-up';
        } else {
            icon.className = 'fas fa-volume-mute';
        }
        
        localStorage.setItem('love_test_sound', soundEnabled);
    }

    // 初始化
    function init() {
        // 切换视图
        toggleView();
        
        // 监听窗口大小变化
        window.addEventListener('resize', toggleView);
        
        // 渲染第一题
        renderQuestion();
        
        // 音效切换
        document.getElementById('soundToggle').addEventListener('click', toggleSound);
        
        // 恢复音效设置
        const savedSound = localStorage.getItem('love_test_sound');
        if (savedSound !== null) {
            soundEnabled = savedSound === 'true';
            toggleSound();
        }
        
        // 键盘支持
        document.addEventListener('keydown', (e) => {
            if (e.key >= '1' && e.key <= '5') {
                const els = getElements();
                const index = parseInt(e.key) - 1;
                const options = els.optionsContainer.children;
                if (index < options.length) {
                    options[index].click();
                }
            }
        });
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
