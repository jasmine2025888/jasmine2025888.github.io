<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>结果报告 - 猪八吉</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Noto+Emoji&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-pink: #FF9494;
            --secondary-pink: #FFC4C4;
            --accent-coral: #FF7A7A;
            --accent-gold: #E8B054;
            --warm-cream: #FFF9F0;
            --cocoa-text: #5A4235;
            --white: #FFFFFF;
            --border-warm: #FFD0C9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html {
            -webkit-text-size-adjust: 100%;
            overflow-x: hidden;
            width: 100vw;
        }

        body {
            font-family: 'Noto Color Emoji', 'Noto Emoji', 'PingFang SC', -apple-system, sans-serif;
            background: linear-gradient(135deg, #FFF9F0 0%, #FFEFDF 100%);
            color: var(--cocoa-text);
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            width: 100vw;
        }

        .emoji {
            font-family: 'Noto Color Emoji', 'Noto Emoji', sans-serif;
            font-size: 1.2em;
        }

        .container {
            max-width: min(600px, calc(100vw - 30px));
            width: 100%;
            background: linear-gradient(to bottom, var(--white), #FFFCF8);
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 10px 40px rgba(93, 75, 64, 0.08);
            text-align: center;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(to right, var(--accent-coral), var(--accent-gold));
        }

        /* 顶部主图 */
        .love-image {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin: 0 auto 15px;
            display: block;
            border-radius: 20px;
            background: white;
            padding: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 3px solid var(--border-warm);
        }
        
        .love-image-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-title {
            color: var(--accent-coral); 
            margin-bottom: 5px; 
            font-size: 24px; 
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .sub-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .result-box {
            background: linear-gradient(135deg, #FFF9F8, #FFF0F0);
            padding: 25px 20px;
            border-radius: 18px;
            margin: 20px 0;
            border: 2px solid var(--secondary-pink);
            position: relative;
        }

        /* 列表项 - 修复双图标关键样式 */
        .details-item {
            display: flex !important;
            align-items: center !important;
            margin-bottom: 15px;
            padding: 12px 15px;
            background: linear-gradient(135deg, #FFF9F8, #FFF0F0);
            border-radius: 15px;
            border: 2px solid var(--secondary-pink);
            width: 100%;
        }

        .double-icons-container {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            gap: 8px !important;
            width: 85px !important;
            flex-shrink: 0 !important;
            margin-right: 15px !important;
        }

        .type-image-icon {
            width: 36px !important;
            height: 36px !important;
            border-radius: 8px;
            background: white;
            border: 2px solid var(--border-warm);
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            overflow: hidden;
            flex-shrink: 0 !important;
        }

        .type-image-icon img {
            width: 75% !important;
            height: 75% !important;
            object-fit: contain;
        }

        .emoji-icon {
            width: 34px !important;
            height: 34px !important;
            border-radius: 50%;
            background: #FFEFEF;
            border: 2px solid white;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 18px;
            flex-shrink: 0 !important;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .type-progress-container {
            flex: 1;
            min-width: 0;
        }

        .bar-bg { 
            height: 8px; 
            background: #F2E9E1; 
            border-radius: 6px; 
            overflow: hidden;
            width: 100%;
        }
        
        .bar-fill { 
            height: 100%; 
            background: linear-gradient(to right, var(--accent-coral), var(--accent-gold));
            transition: width 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .details-percent {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent-coral);
            min-width: 50px;
            text-align: right;
        }

        /* 按钮和其他样式保持原样 */
        .btn { width: 100%; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; border: none; }
        .btn-pink { background: var(--accent-coral); color: white; box-shadow: 0 5px 15px rgba(255,122,122,0.3); }
        .btn-white { background: white; border: 2px solid var(--border-warm); color: var(--cocoa-text); }
        .msg-box { background: #FFFBF0; padding: 20px; border-radius: 16px; border: 2px dashed var(--accent-gold); text-align: left; margin: 20px 0; }
        .medal-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 10000; padding: 15px; }
        .medal-content { background: white; border-radius: 16px; max-width: 300px; width: 100%; overflow: hidden; }
        .medal-canvas-container { width: 100%; aspect-ratio: 3/4; background: #FFF9F0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; }
        
        @media (max-width: 480px) {
            .double-icons-container { width: 75px; gap: 5px; margin-right: 10px; }
            .type-image-icon, .emoji-icon { width: 32px; height: 32px; }
            .details-percent { font-size: 16px; min-width: 40px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="main-title"><i class="fas fa-heart"></i> ❤️ 爱的语言</div>
    <div class="sub-title">翻译报告</div>
    <p id="date" style="font-size:12px; color:#999; margin-bottom:5px;"></p>

    <div class="result-box">
        <div class="love-image-container">
            <img id="mainLoveImage" class="love-image" src="" alt="结果图">
        </div>
        <div id="typeName" class="type-name" style="font-size:28px; font-weight:800; color:var(--accent-coral); margin-bottom:10px;"></div>
        <div id="scoreVal" class="score" style="font-size:16px; font-weight:bold; background:white; padding:8px 15px; border-radius:20px; display:inline-block; border:1px solid var(--border-warm);"></div>
        <p id="typeDesc" class="type-desc" style="margin-top:15px; line-height:1.6;"></p>
        <div id="loveEmojis" class="love-emojis-container" style="display:flex; justify-content:center; gap:10px; margin-top:15px;"></div>
    </div>

    <!-- 修复后的详情列表容器 -->
    <div id="details" class="details-container"></div>

    <div class="msg-box">
        <p style="font-weight:bold; margin-bottom:8px; display:flex; align-items:center;">
            <img id="pigAvatarImg" src="https://jasmine2025888.github.io/love-language-translator/images/my-pig-avatar.png" style="width:30px; height:30px; border-radius:50%; margin-right:8px;" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzAiIGhlaWdodD0iMzAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMTUiIGN5PSIxNSIgcj0iMTUiIGZpbGw9IiNGRjk0OTQiLz48L3N2Zz4='">
            猪八吉寄语
        </p>
        <p id="pigMsg" style="font-size:14px; line-height:1.6;"></p>
    </div>

    <div id="shareCardPlaceholder" style="margin:20px 0; border-radius:12px; overflow:hidden;"></div>

    <button class="btn btn-pink" id="generateMedalBtn"><i class="fas fa-award"></i> 生成我的专属爱语勋章</button>
    <button class="btn btn-pink" onclick="copy()"><i class="fas fa-share-alt"></i> 分享到小红书（复制文案）</button>
    <button class="btn btn-white" onclick="location.href='index.html'"><i class="fas fa-redo"></i> 重新测试</button>

    <div style="margin-top:20px; padding:15px; background:#F8F5F0; border-radius:12px;">
        <div id="qrcodePlaceholder" style="width:100px; height:100px; margin:0 auto 10px;"></div>
        <p style="font-size:13px;">💌 勾搭猪八吉：<b>zhubaji888</b></p>
    </div>
</div>

<!-- 勋章模态框保持原样 -->
<div class="medal-modal" id="medalModal">
    <div class="medal-content">
        <div class="medal-canvas-container" id="medalCanvas"></div>
        <div style="display:flex; gap:10px; padding:15px; background:#fefefe;">
            <button class="btn btn-pink" id="saveMedalBtn" style="flex:1; margin:0;">保存图片</button>
            <button class="btn btn-white" id="closeMedalBtn" style="flex:1; margin:0;">关闭</button>
        </div>
    </div>
</div>

<script>
    // 基础配置
    const imageBaseURL = "https://jasmine2025888.github.io/love-language-translator/images/";
    const loveTypeImages = {
        words: imageBaseURL + "love_words.png",
        acts: imageBaseURL + "love_acts.png",
        gifts: imageBaseURL + "love_gifts.png",
        time: imageBaseURL + "love_time.png",
        touch: imageBaseURL + "love_touch.png"
    };

    const info = {
        words: { name: "言语派", emoji: "💬", desc: "你渴望肯定。一句'辛苦了'、'有你真好'能让你满血复活。", msg: "媳妇喜欢听好话，俺以后每天夸她三遍！有她在，家就是暖的。", slogan: "爱要说出口，天天把我夸" },
        acts: { name: "行动派", emoji: "🤗", desc: "你相信爱是做出来的。对方帮你分担家务时，你最能感到被爱。", msg: "地俺扫了，碗俺刷了，媳妇你歇着！爱不是说说，是做给你看。", slogan: "爱是做出来，行动最实在" },
        gifts: { name: "仪式派", emoji: "🎁", desc: "礼物代表心意。不在乎贵重，而是在乎你被TA记挂在心上。", msg: "给媳妇带了她爱吃的果子，看她笑俺心都化了。小礼物，大心意。", slogan: "礼物表心意，惊喜暖心里" },
        time: { name: "陪伴派", emoji: "🕰️", desc: "你最想要的是专注。人在，心也要在。", msg: "手机放下，俺陪媳妇散步去，咱俩静静待着。时间，是最好的礼物。", slogan: "陪伴最长情，用心才是爱" },
        touch: { name: "情感派", emoji: "👫", desc: "拥抱、牵手、依偎。身体接触让你感到最直接的爱。", msg: "媳妇不开心？俺抱抱她，啥烦恼都没啦！一个拥抱，胜过千言万语。", slogan: "拥抱最直接，触碰到真心" }
    };

    // 获取数据
    const rawData = localStorage.getItem('love_result');
    let data = rawData ? JSON.parse(rawData) : { main: 'words', percent: 75, all: { words: 8, acts: 2, gifts: 0, time: 0, touch: 0 } };

    // 【核心修复版】渲染列表
    function displayResults() {
        document.getElementById('date').innerText = "测试时间：" + (data.date || new Date().toLocaleString('zh-CN'));
        
        const main = info[data.main] || info.words;
        document.getElementById('typeName').innerText = main.name;
        document.getElementById('scoreVal').innerText = "主导爱语匹配度：" + (data.percent || 0) + "%";
        document.getElementById('typeDesc').innerText = main.desc;
        document.getElementById('pigMsg').innerText = main.msg;
        document.getElementById('mainLoveImage').src = loveTypeImages[data.main] || loveTypeImages.words;

        // 生成详细分析列表
        let html = "";
        const typeOrder = ['words', 'acts', 'gifts', 'time', 'touch'];
        const total = Object.values(data.all || {}).reduce((a, b) => a + Number(b), 0) || 1;

        typeOrder.forEach((key) => {
            const item = info[key];
            const val = Number(data.all ? data.all[key] : 0);
            const pct = Math.round((val / total) * 100);

            html += `
                <div class="details-item">
                    <div class="double-icons-container">
                        <div class="type-image-icon">
                            <img src="${loveTypeImages[key]}" onerror="this.style.opacity='0'">
                        </div>
                        <div class="emoji-icon">${item.emoji}</div>
                    </div>
                    <div class="type-progress-container">
                        <div style="font-size:14px; font-weight:bold; margin-bottom:4px;">${item.name}</div>
                        <div class="bar-bg">
                            <div class="bar-fill" style="width: ${pct}%"></div>
                        </div>
                    </div>
                    <div class="details-percent">${pct}%</div>
                </div>
            `;
        });
        document.getElementById('details').innerHTML = html;
    }

    // 勋章生成逻辑（完整保留）
    function generateMedalContent() {
        const main = info[data.main] || info.words;
        const canvas = document.getElementById('medalCanvas');
        const colorMap = { words: "#FF9494", acts: "#FF7A7A", gifts: "#E8B054", time: "#FFA07A", touch: "#FF8A65" };
        
        canvas.innerHTML = `
            <div style="width:100%; height:100%; background:#FFF9F0; border-radius:15px; padding:20px; display:flex; flex-direction:column; align-items:center; border:8px solid ${colorMap[data.main]}">
                <img src="${imageBaseURL}my-pig-avatar.png" style="width:80px; height:80px; border-radius:50%; border:4px solid white; margin-bottom:15px;">
                <div style="font-size:12px; color:#8A7565;">猪八吉家传·爱语勋章</div>
                <div style="font-size:24px; font-weight:900; color:${colorMap[data.main]}; margin:10px 0;">${main.name}</div>
                <div style="font-size:18px; font-weight:bold; background:white; padding:5px 15px; border-radius:20px;">匹配度 ${data.percent}%</div>
                <div style="font-size:14px; margin:15px 0; line-height:1.4;">${main.desc}</div>
                <div style="font-weight:bold; color:${colorMap[data.main]}; border:2px dashed ${colorMap[data.main]}; padding:10px; border-radius:10px;">${main.slogan}</div>
            </div>
        `;
    }

    // 分享和保存逻辑（完整保留）
    function copy() {
        const main = info[data.main] || info.words;
        const text = `我刚测了猪八吉家的「爱的语言翻译器」🍯\n我的爱语类型是：${main.name}\n匹配度：${data.percent}%\n#猪八吉 #情侣测试 #情人节`;
        navigator.clipboard.writeText(text).then(() => alert("✨ 文案已复制！快去分享吧~"));
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
        displayResults();
        
        // 加载二维码和分享图
        const qr = document.getElementById('qrcodePlaceholder');
        qr.innerHTML = `<img src="${imageBaseURL}wechat_qrcode.png" style="width:100%; height:100%; object-fit:contain;">`;
        
        const sc = document.getElementById('shareCardPlaceholder');
        sc.innerHTML = `<img src="${imageBaseURL}share_card.jpg" style="width:100%; object-fit:contain; border-radius:12px;">`;

        // 勋章弹窗逻辑
        const modal = document.getElementById('medalModal');
        document.getElementById('generateMedalBtn').onclick = () => {
            generateMedalContent();
            modal.style.display = 'flex';
        };
        document.getElementById('closeMedalBtn').onclick = () => modal.style.display = 'none';
        
        document.getElementById('saveMedalBtn').onclick = () => {
            html2canvas(document.getElementById('medalCanvas')).then(canvas => {
                const link = document.createElement('a');
                link.download = '猪八吉勋章.png';
                link.href = canvas.toDataURL();
                link.click();
            });
        };
    });
</script>
</body>
</html>
