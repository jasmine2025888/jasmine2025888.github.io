<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爱的方言报告 - 猪八吉</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-pink: #FFB1B1;
            --soft-cream: #FFFBF5;
            --cocoa-text: #5D4B40;
            --white: #FFFFFF;
            --border-warm: #E8D5C4;
        }

        body {
            font-family: 'PingFang SC', sans-serif;
            background-color: var(--soft-cream);
            color: var(--cocoa-text);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .result-container {
            max-width: 800px;
            width: 100%;
            background: var(--white);
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(93, 75, 64, 0.08);
            text-align: center;
        }

        h1 { color: #FF8E8E; margin-bottom: 10px; font-size: 28px; }
        
        .main-result-box {
            background: #FFFBFA;
            padding: 30px;
            border-radius: 24px;
            margin: 30px 0;
            border: 2px solid #FFF0F0;
        }

        .main-type-name { font-size: 36px; font-weight: 800; color: #FF8E8E; }
        .match-score { font-size: 20px; margin: 10px 0; font-weight: bold; }

        .breakdown-bar {
            height: 12px;
            background: #F2E9E1;
            border-radius: 10px;
            margin: 10px 0 20px 0;
            overflow: hidden;
        }
        .breakdown-fill { height: 100%; background: var(--primary-pink); border-radius: 10px; }

        .pig-message {
            background: #FFF9E3;
            padding: 25px;
            border-radius: 20px;
            border: 2px dashed #E8D5C4;
            margin: 30px 0;
            text-align: left;
        }

        .action-btn {
            padding: 16px 30px;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            margin-bottom: 15px;
        }

        .btn-share { background: linear-gradient(to right, #FFB1B1, #FF8E8E); color: white; }
        .btn-retake { background: white; color: var(--cocoa-text); border: 2px solid var(--border-warm); }

        .wechat-box { background: #f9f9f9; padding: 25px; border-radius: 20px; margin-top: 40px; }
        
        .type-item { text-align: left; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="result-container">
        <div class="result-header">
            <h1>❤️ 猪八吉·爱的方言翻译报告</h1>
            <p id="testDate" style="font-size: 14px; color: #999;"></p>
        </div>

        <div class="main-result-box" id="mainResult"></div>

        <div id="detailsBox"></div>

        <div class="pig-message" id="pigMessage"></div>

        <button class="action-btn btn-share" onclick="copyShare()">分享到小红书（复制文案）</button>
        <button class="action-btn btn-retake" onclick="location.href='index.html'">重新测试</button>

        <div class="wechat-box">
            <p>💌 获取更多猪八吉夫妻干货</p>
            <p style="font-weight: bold; margin-top: 10px; font-size: 18px;">微信号：zhubaji2025</p>
            <p style="font-size: 14px; color: #999; margin-top: 5px;">备注"小红书"优先通过</p>
        </div>
    </div>

    <script>
        const loveInfo = {
            words: { name: "💬 言值派", desc: "你渴望听到对方的肯定，一句‘你真棒’能让你开心很久。", msg: "猪八吉：俺以前不懂，原来好话一句三冬暖！以后俺天天夸媳妇！" },
            acts: { name: "🤗 行动派", desc: "你相信爱是做出来的。对方为你分担家务、为你倒杯水，你最能感到被爱。", msg: "猪八吉：地俺扫了，碗俺刷了，媳妇你歇着，看俺干活就行！" },
            gifts: { name: "🎁 仪式派", desc: "礼物代表心意，不在乎贵重。你最在乎的是：TA是否时刻把你记挂在心上。", msg: "猪八吉：给媳妇带了她最爱吃的果子，看她拆开时那个笑，俺心都化了。" },
            time: { name: "🕰️ 陪伴派", desc: "对你来说，最奢侈的礼物是TA的专注时间。人在，心也要在。", msg: "猪八吉：手机放下，俺陪媳妇散步去。啥也不干，就咱俩待着。" },
            touch: { name: "👫 接触派", desc: "拥抱、牵手、依偎。身体接触让你感受到最直接、最踏实的爱意。", msg: "猪八吉：媳妇心情不好？俺抱抱她，啥烦恼都没啦！" }
        };

        const data = JSON.parse(localStorage.getItem('loveLanguageResults'));
        if(data) {
            document.getElementById('testDate').innerText = "测试时间：" + data.testDate;
            const main = loveInfo[data.mainType];
            
            document.getElementById('mainResult').innerHTML = `
                <div class="main-type-name">${main.name}</div>
                <div class="match-score">主导爱语匹配度：${data.percent}%</div>
                <p style="line-height:1.6;">${main.desc}</p>
            `;

            document.getElementById('pigMessage').innerHTML = `
                <p style="font-weight: bold; margin-bottom: 10px;">🐷 猪八吉夫妻寄语：</p>
                <p style="line-height:1.6;">${main.msg}</p>
            `;

            let detailHtml = "";
            const sortedCounts = Object.entries(data.allCounts).sort((a,b) => b[1] - a[1]);
            sortedCounts.forEach(([type, count]) => {
                const info = loveInfo[type];
                const p = Math.round((count/12)*100);
                detailHtml += `
                    <div class="type-item">
                        <span>${info.name} (${p}%)</span>
                        <div class="breakdown-bar"><div class="breakdown-fill" style="width:${p}%"></div></div>
                    </div>
                `;
            });
            document.getElementById('detailsBox').innerHTML = detailHtml;
        }

        function copyShare() {
            const txt = "我刚测了猪八吉家的「爱的方言翻译器」，我是典型的" + loveInfo[data.mainType].name + "！情人节快到了，快来测测你和TA的相处密码吧~ #猪八吉 #情感测试";
            navigator.clipboard.writeText(txt);
            alert("分享文案已复制！去发小红书吧~");
        }
    </script>
</body>
</html>
