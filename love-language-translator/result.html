<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试结果 - 猪八吉爱的方言翻译器</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #7C3AED;      /* 紫色 */
            --secondary-color: #F59E0B;    /* 琥珀色 */
            --accent-color: #10B981;       /* 翡翠绿 */
            --dark-color: #4C1D95;         /* 深紫色 */
            --light-bg: #FAF5FF;           /* 浅紫色背景 */
            --border-color: #DDD6FE;       /* 浅紫色边框 */
            --text-dark: #1F2937;          /* 深灰文字 */
            --text-light: #6B7280;         /* 中灰文字 */
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #FAF5FF 0%, #FDF4FF 100%);
            color: var(--text-dark);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .result-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 25px;
            box-shadow: 0 15px 50px rgba(139, 92, 246, 0.15);
            overflow: hidden;
            padding: 40px;
        }

        .result-header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 3px dashed var(--border-color);
        }

        .result-title {
            font-size: 32px;
            color: var(--dark-color);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .result-title i {
            color: var(--primary-color);
        }

        .result-subtitle {
            font-size: 18px;
            color: var(--text-light);
            margin-bottom: 20px;
        }

        .result-date {
            font-size: 14px;
            color: #999;
            background: #F9F9F9;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
        }

        /* 主要结果 */
        .main-result {
            text-align: center;
            margin: 40px 0;
            padding: 30px;
            background: linear-gradient(135deg, #FAF5FF, #FDF4FF);
            border-radius: 20px;
            border: 3px solid var(--border-color);
        }

        .main-type {
            font-size: 42px;
            font-weight: 800;
            margin: 15px 0;
            line-height: 1.2;
        }

        .main-score {
            font-size: 28px;
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 20px;
        }

        .main-desc {
            font-size: 18px;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* 详细分析 */
        .detailed-analysis {
            margin: 40px 0;
        }

        .section-title {
            font-size: 24px;
            color: var(--dark-color);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--primary-color);
        }

        .breakdown-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .breakdown-item {
            display: flex;
            align-items: center;
            background: #F9F9F9;
            padding: 18px 25px;
            border-radius: 15px;
            border-left: 5px solid;
            transition: all 0.3s ease;
        }

        .breakdown-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .breakdown-icon {
            font-size: 30px;
            margin-right: 20px;
            width: 60px;
            text-align: center;
        }

        .breakdown-content {
            flex: 1;
        }

        .breakdown-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .breakdown-percent {
            font-size: 16px;
            font-weight: 700;
            color: var(--dark-color);
        }

        .breakdown-bar {
            height: 10px;
            background: #EEE;
            border-radius: 5px;
            margin-top: 10px;
            overflow: hidden;
        }

        .breakdown-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 1s ease;
        }

        /* 建议部分 */
        .suggestions {
            margin: 40px 0;
        }

        .suggestion-card {
            background: linear-gradient(135deg, #FAF5FF, white);
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 20px;
            border: 2px solid var(--border-color);
        }

        .suggestion-title {
            font-size: 20px;
            color: var(--dark-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .suggestion-content {
            font-size: 16px;
            line-height: 1.6;
        }

        .suggestion-list {
            list-style-type: none;
            padding-left: 0;
        }

        .suggestion-list li {
            padding: 8px 0;
            padding-left: 25px;
            position: relative;
        }

        .suggestion-list li:before {
            content: '✓';
            position: absolute;
            left: 0;
            color: var(--primary-color);
            font-weight: bold;
        }

        /* 行动按钮 */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 16px 30px;
            border: none;
            border-radius: 15px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 180px;
        }

        .btn-share {
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .btn-share:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
        }

        .btn-retake {
            background: white;
            color: var(--text-dark);
            border: 3px solid var(--border-color);
        }

        .btn-retake:hover {
            background: var(--light-bg);
            border-color: var(--primary-color);
            transform: translateY(-3px);
        }

        /* 猪八吉寄语 */
        .pig-message {
            background: linear-gradient(to right, #FAF5FF, #FDF4FF);
            padding: 30px;
            border-radius: 20px;
            margin: 40px 0;
            border: 3px solid var(--primary-color);
            position: relative;
            overflow: hidden;
        }

        .pig-message:before {
            content: '🐷';
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 60px;
            opacity: 0.2;
        }

        .pig-message-title {
            font-size: 22px;
            color: var(--dark-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pig-message-content {
            font-size: 16px;
            line-height: 1.7;
        }

        /* 私域引流 */
        .private-domain {
            text-align: center;
            padding: 30px;
            background: #F9F9F9;
            border-radius: 20px;
            margin-top: 40px;
        }

        .private-title {
            font-size: 22px;
            color: var(--dark-color);
            margin-bottom: 15px;
        }

        .private-desc {
            font-size: 16px;
            color: var(--text-light);
            margin-bottom: 25px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .wechat-card {
            display: inline-flex;
            align-items: center;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            gap: 20px;
            margin-top: 15px;
        }

        .qrcode-placeholder {
            width: 120px;
            height: 120px;
            background: #EEE;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .result-container {
                padding: 25px;
            }
            
            .result-title {
                font-size: 26px;
            }
            
            .main-type {
                font-size: 32px;
            }
            
            .breakdown-item {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .breakdown-icon {
                margin-right: 0;
                margin-bottom: 10px;
            }
            
            .action-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .action-btn {
                width: 100%;
                max-width: 300px;
            }
            
            .wechat-card {
                flex-direction: column;
                text-align: center;
            }
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.8s ease forwards;
        }
    </style>
</head>
<body>
    <div class="result-container">
        <!-- 结果头部 -->
        <div class="result-header fade-in">
            <h1 class="result-title">
                <i class="fas fa-heart"></i> 猪八吉家传·爱的方言翻译器
            </h1>
            <p class="result-subtitle">你的专属爱情语言分析报告</p>
            <div class="result-date" id="resultDate"></div>
        </div>

        <!-- 主要结果 -->
        <div class="main-result fade-in" id="mainResult">
            <!-- 内容由JavaScript动态生成 -->
        </div>

        <!-- 详细分析 -->
        <div class="detailed-analysis fade-in">
            <h2 class="section-title">
                <i class="fas fa-chart-pie"></i> 详细分析
            </h2>
            <div class="breakdown-list" id="breakdownList">
                <!-- 内容由JavaScript动态生成 -->
            </div>
        </div>

        <!-- 个性化建议 -->
        <div class="suggestions fade-in">
            <h2 class="section-title">
                <i class="fas fa-lightbulb"></i> 猪八吉的个性化建议
            </h2>
            <div class="suggestion-card" id="suggestionsContent">
                <!-- 内容由JavaScript动态生成 -->
            </div>
        </div>

        <!-- 猪八吉寄语 -->
        <div class="pig-message fade-in">
            <h3 class="pig-message-title">
                <i class="fas fa-comment-dots"></i> 猪八吉夫妻寄语
            </h3>
            <div class="pig-message-content" id="pigMessage">
                <!-- 内容由JavaScript动态生成 -->
            </div>
        </div>

        <!-- 行动按钮 -->
        <div class="action-buttons fade-in">
            <button class="action-btn btn-share" onclick="shareResult()">
                <i class="fas fa-share-alt"></i> 分享到小红书
            </button>
            <button class="action-btn btn-retake" onclick="retakeTest()">
                <i class="fas fa-redo"></i> 重新测试
            </button>
        </div>

        <!-- 私域引流 -->
        <div class="private-domain fade-in">
            <h3 class="private-title">💌 获取更多夫妻关系干货</h3>
            <p class="private-desc">
                想获得更多猪八吉夫妻的相处智慧？<br>
                加入「幸福夫妻交流群」，每周分享实用技巧 + 专属福利
            </p>
            <div class="wechat-card">
                <div class="qrcode-placeholder">
                    微信二维码<br>（后期替换）
                </div>
                <div>
                    <p style="font-weight: 600; margin-bottom: 5px;">微信号：zhubaji888</p>
                    <p style="font-size: 14px; color: #666;">备注"小红书"优先通过</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== 爱语类型描述 =====
        const loveTypes = {
            words: { 
                name: "💬 言值派", 
                color: "#7C3AED", 
                desc: "你通过语言表达爱，也渴望听到对方的肯定。一句'我爱你'、'你真棒'能让你开心一整天。",
                suggestions: [
                    "每天对TA说一句具体的赞美（如：'你今天做的饭真好吃'）",
                    "当TA为你做事时，一定要说'谢谢'或'辛苦了'",
                    "避免用批评或指责的语言，多表达欣赏",
                    "睡前说一句'晚安，我爱你'，养成习惯",
                    "写小卡片或情书，表达你的爱意"
                ],
                pigMessage: "猪八吉：'俺以前不懂，现在知道了，好话一句三冬暖！媳妇就是喜欢听俺夸她！'<br>媳妇：'语言是爱的桥梁，多说好听的，感情自然好。'"
            },
            acts: { 
                name: "🤗 行动派", 
                color: "#F59E0B", 
                desc: "你相信爱是做出来的，不是说出来。对方为你做的每件小事，都是爱的证明。",
                suggestions: [
                    "主动分担家务，不用等TA提醒",
                    "记住TA的喜好，为TA做贴心小事",
                    "当TA需要帮助时，第一时间行动",
                    "用行动表达关心（如：为晚归的TA热饭）",
                    "一起完成家庭任务，体验合作的快乐"
                ],
                pigMessage: "猪八吉：'俺就爱干活！媳妇让俺往东，俺绝不往西！'<br>媳妇：'行动胜过千言万语，看他干活的样子，就知道他心里有家。'"
            },
            gifts: { 
                name: "🎁 仪式派", 
                color: "#10B981", 
                desc: "礼物对你很重要，它代表心意和重视。不需要贵重，但需要用心。",
                suggestions: [
                    "记住重要的纪念日，准备小礼物",
                    "出差或旅行时，给TA带当地特产",
                    "观察TA最近需要什么，送实用的小东西",
                    "亲手制作礼物，更有心意",
                    "偶尔的'惊喜礼物'能让感情升温"
                ],
                pigMessage: "猪八吉：'媳妇生日俺送了个自己做的小木盒，她高兴了好几天！'<br>媳妇：'礼物不在贵重，在心意。他能记住我喜欢什么，我就很开心。'"
            },
            time: { 
                name: "🕰️ 陪伴派", 
                color: "#7C3AED", 
                desc: "对你来说，最奢侈的礼物是TA的专注时间。人在心在，比什么都重要。",
                suggestions: [
                    "每天留出30分钟'专属聊天时间'，不玩手机",
                    "一起发展共同爱好（运动、手工、看剧）",
                    "定期安排'约会日'，找回恋爱感觉",
                    "散步时认真倾听TA的分享",
                    "工作时互不打扰，但休息时全心陪伴"
                ],
                pigMessage: "猪八吉：'媳妇说俺玩手机太多，现在俺每天陪她散步半小时！'<br>媳妇：'陪伴是最长情的告白，人在心也要在。'"
            },
            touch: { 
                name: "👫 接触派", 
                color: "#EC4899", 
                desc: "你喜欢拥抱、牵手、依偎，身体接触让你感受到最直接的爱意。",
                suggestions: [
                    "每天出门前和回家后给TA一个拥抱",
                    "走路时自然牵手，坐车时靠在一起",
                    "为TA按摩肩膀或背部，缓解疲劳",
                    "看电视时依偎在沙发上",
                    "用肢体语言表达关心（如：摸摸头、拍拍肩）"
                ],
                pigMessage: "猪八吉：'媳妇心情不好，俺抱抱她就好多了！'<br>媳妇：'一个拥抱胜过千言万语，肢体接触让我感觉被爱。'"
            }
        };

        // ===== 页面加载时显示结果 =====
        document.addEventListener('DOMContentLoaded', function() {
            // 从localStorage获取结果
            const resultData = JSON.parse(localStorage.getItem('loveLanguageResults'));
            
            // 调试信息
            console.log("1. 从localStorage获取数据:", resultData);
            
            if (!resultData) {
                console.log("2. 没有找到测试数据");
                // 没有结果数据，提示用户先完成测试
                const mainResultEl = document.getElementById('mainResult');
                if (mainResultEl) {
                    mainResultEl.innerHTML = `
                        <div style="text-align: center; padding: 40px;">
                            <h3 style="color: #7C3AED; margin-bottom: 20px;">未找到测试结果</h3>
                            <p style="margin-bottom: 25px;">请先完成爱的方言翻译器测试</p>
                            <button onclick="window.location.href='index.html'" 
                                    style="padding: 12px 30px; background: #7C3AED; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer;">
                                开始测试
                            </button>
                        </div>
                    `;
                }
                return;
            }
            
            console.log("3. 找到测试数据，开始显示结果");
            
            // 显示测试日期
            const resultDateEl = document.getElementById('resultDate');
            if (resultDateEl) {
                resultDateEl.textContent = `测试时间：${resultData.testDate}`;
            }
            
            // 显示主要结果
            const mainResultEl = document.getElementById('mainResult');
            if (mainResultEl && resultData.mainType) {
                const mainType = resultData.mainType;
                const mainTypeInfo = loveTypes[mainType];
                const mainResult = resultData.results[0];
                
                console.log("4. 主要爱语类型:", mainType);
                
                mainResultEl.innerHTML = `
                    <div style="font-size: 20px; color: #666; margin-bottom: 10px;">你的主要爱语类型是</div>
                    <div class="main-type" style="color: ${mainTypeInfo.color}">${mainTypeInfo.name}</div>
                    <div class="main-score">匹配度：${mainResult.percent}%</div>
                    <div class="main-desc">${mainTypeInfo.desc}</div>
                `;
            }
            
            // 显示详细分析
            const breakdownListEl = document.getElementById('breakdownList');
            if (breakdownListEl && resultData.results) {
                breakdownListEl.innerHTML = '';
                
                resultData.results.forEach(item => {
                    const typeInfo = loveTypes[item.type];
                    const itemEl = document.createElement('div');
                    itemEl.className = 'breakdown-item';
                    itemEl.style.borderLeftColor = typeInfo.color;
                    
                    itemEl.innerHTML = `
                        <div class="breakdown-icon">${typeInfo.name.split(' ')[0]}</div>
                        <div class="breakdown-content">
                            <div class="breakdown-name">${typeInfo.name}</div>
                            <div class="breakdown-percent">${item.count}次选择 · ${item.percent}%</div>
                            <div class="breakdown-bar">
                                <div class="breakdown-fill" style="width: ${item.percent}%; background: ${typeInfo.color};"></div>
                            </div>
                        </div>
                    `;
                    
                    breakdownListEl.appendChild(itemEl);
                });
            }
            
            // 显示个性化建议
            const suggestionsContentEl = document.getElementById('suggestionsContent');
            if (suggestionsContentEl && resultData.mainType) {
                const mainType = resultData.mainType;
                const mainTypeInfo = loveTypes[mainType];
                
                suggestionsContentEl.innerHTML = `
                    <h3 class="suggestion-title" style="color: ${mainTypeInfo.color}">
                        <i class="fas fa-star"></i> 给${mainTypeInfo.name.split(' ')[1]}的专属建议
                    </h3>
                    <div class="suggestion-content">
                        <ul class="suggestion-list">
                            ${mainTypeInfo.suggestions.map(s => `<li>${s}</li>`).join('')}
                        </ul>
                        <p style="margin-top: 20px; font-style: italic; color: #666;">
                            情人节特别提示：${getValentineTip(mainType)}
                        </p>
                    </div>
                `;
            }
            
            // 显示猪八吉寄语
            const pigMessageEl = document.getElementById('pigMessage');
            if (pigMessageEl && resultData.mainType) {
                const mainType = resultData.mainType;
                const mainTypeInfo = loveTypes[mainType];
                pigMessageEl.innerHTML = mainTypeInfo.pigMessage;
            }
            
            // 添加延迟动画
            const fadeElements = document.querySelectorAll('.fade-in');
            fadeElements.forEach((el, index) => {
                el.style.animationDelay = `${index * 0.2}s`;
            });
            
            console.log("5. 结果页面渲染完成");
        });

        // ===== 获取情人节特别建议 =====
        function getValentineTip(mainType) {
            const tips = {
                words: "情人节，对TA说'我爱你'不如说'我欣赏你的XX品质'，具体赞美更打动人。",
                acts: "情人节不用大餐礼物，为TA做一件平时不愿意做的事（如：洗碗一周），更有诚意。",
                gifts: "情人节礼物不在贵，在走心。观察TA最近需要什么，送TA真正用得上的。",
                time: "情人节最好的礼物是'专注陪伴'。关掉手机，和TA好好聊一晚。",
                touch: "情人节多牵手、拥抱、依偎。肢体接触比任何礼物都温暖。"
            };
            return tips[mainType] || "情人节，用TA能懂的方式表达爱，就是最好的礼物。";
        }

        // ===== 分享功能 =====
        function shareResult() {
            const resultData = JSON.parse(localStorage.getItem('loveLanguageResults'));
            if (!resultData) return;
            
            const mainType = loveTypes[resultData.mainType].name;
            const score = resultData.results[0].percent;
            
            // 创建分享文本
            const shareText = `我刚测了猪八吉家的「爱的方言翻译器」，发现我的爱语类型是${mainType}，匹配度${score}%！\n\n测测你的爱语类型，情人节更懂TA～\n\n#猪八吉 #爱的方言测试 #情人节礼物 #情侣测试`;
            
            // 复制到剪贴板
            navigator.clipboard.writeText(shareText).then(() => {
                alert('分享内容已复制到剪贴板！\n\n请打开小红书，粘贴并发布笔记，记得@猪八吉爱媳妇 哦！\n\n前100名分享者送猪八吉隐藏表情包🎁');
            }).catch(err => {
                console.error('复制失败:', err);
                alert('请手动复制分享内容：\n\n' + shareText);
            });
        }

        // ===== 重新测试 =====
        function retakeTest() {
            if (confirm('确定要重新测试吗？当前结果将会被清除。')) {
                localStorage.removeItem('loveLanguageResults');
                window.location.href = 'index.html';
            }
        }
    </script>
